  <body>
    <header>
      <h1>Orson Brooker</h1>
      <p>Hi, I'm Orson! Welcome to my website. Can you beat my high score?</p>
    </header>

    <main>
      <div class="stage" id="stage" tabindex="0" aria-label="Basketball game. Press Space or tap to turn to the hoop, hold to jump, let go to shoot.">
        <img class="court" src="assets/court.webp" alt="" width="2048" height="2048" />
        <canvas id="game"></canvas>

        <p class="sr-only">Score <span id="score">0</span>, <span id="time">60</span> seconds left</p>

        <div class="sound-buttons">
          <button id="music" type="button" aria-label="Turn music off" aria-pressed="true">♫</button>
          <button id="mute" type="button" aria-label="Mute sound">🔊</button>
        </div>

        <div class="overlay" id="overlay">
          <div class="panel">
            <h2 id="overlay-title">Loading…</h2>
            <p id="overlay-body"></p>
          </div>
        </div>
      </div>
    </main>
