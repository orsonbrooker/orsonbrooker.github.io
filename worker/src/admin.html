<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>Admin | Orson Brooker</title>
		<link rel="icon" href="/favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
		<style>
			:root {
				--bg: #a6798e;
				--ink: #2b1622;
				--panel: rgba(43, 22, 34, 0.88);
				--line: rgba(255, 255, 255, 0.12);
				--accent: #f08a3c;
				--yellow: #ffe066;
				--good: #3ddc84;
				--bad: #ff6b6b;
				--pixel: "Press Start 2P", ui-monospace, monospace;
			}
			* { box-sizing: border-box; }
			[hidden] { display: none !important; }
			body {
				margin: 0;
				padding: 0 12px 24px;
				background: var(--bg);
				color: #fff;
				font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
				font-size: 14px;
			}
			main { max-width: 1200px; margin: 0 auto; }
			h1, h2, nav button, .pixel { font-family: var(--pixel); }

			/* Header: title and tabs in one bar that stays at the top. */
			header {
				position: sticky; top: 0; z-index: 5;
				display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
				padding: 10px 0; background: var(--bg);
			}
			h1 { font-size: 14px; margin: 0; text-shadow: 2px 2px 0 var(--ink); }
			nav { display: flex; gap: 6px; flex: 1; }
			nav button { flex: 1; font-size: 10px; padding: 9px 8px; }
			h2 { font-size: 11px; margin: 18px 0 8px; }
			.group { margin: 0 0 10px; }
			.group > summary { cursor: pointer; font-weight: bold; font-size: 15px; padding: 6px 2px; list-style: none; }
			.group > summary::before { content: "▸ "; opacity: 0.7; }
			.group[open] > summary::before { content: "▾ "; }
			.group > summary .count { opacity: 0.7; font-weight: normal; }

			button {
				font: inherit;
				border: 0;
				border-radius: 5px;
				padding: 6px 10px;
				background: rgba(255, 255, 255, 0.12);
				color: #fff;
				cursor: pointer;
			}
			button:hover { background: rgba(255, 255, 255, 0.2); }
			button.primary { background: var(--accent); color: var(--ink); }
			button.danger { background: var(--bad); color: var(--ink); }
			button.suggested { outline: 3px solid var(--yellow); outline-offset: 1px; }
			nav button { background: var(--panel); }
			nav button[aria-selected="true"] { background: var(--accent); color: var(--ink); }

			input[type="text"], textarea, select {
				width: 100%;
				font: inherit;
				padding: 5px 7px;
				border-radius: 4px;
				border: 1px solid var(--ink);
				background: #fff;
				color: var(--ink);
			}
			textarea { min-height: 38px; resize: vertical; }
			input[type="color"] { width: 100%; height: 30px; padding: 0; border: 1px solid var(--ink); border-radius: 4px; background: none; }
			.field span { display: block; font-size: 11px; margin-bottom: 2px; opacity: 0.75; }
			.check { display: flex; gap: 6px; align-items: center; font-size: 13px; }
			.meta { font-size: 12px; opacity: 0.75; }
			.empty { background: var(--panel); border-radius: 8px; text-align: center; padding: 24px; font-family: var(--pixel); font-size: 11px; line-height: 1.8; }
			.summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
			.summary span { background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 13px; }

			/* Inbox ideas: details on the left, actions on the right (stacked underneath on a phone). */
			.sub {
				display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 12px;
				background: var(--panel); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
			}
			.sub h3 { font-size: 16px; margin: 1px 0 2px; }
			.sub .quote { margin: 0 0 6px; font-size: 13px; opacity: 0.7; white-space: pre-wrap; }
			.sub .note { margin: 0 0 8px; padding: 4px 8px; border-left: 3px solid var(--yellow); background: rgba(255, 224, 102, 0.1); font-size: 13px; }
			.sub .fields { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px 8px; }
			.sub .fields .wide { grid-column: 1 / -1; }
			.sub .actions { display: flex; flex-direction: column; gap: 5px; }
			.sub .actions .danger { margin-top: auto; }
			.sub .credit-row { display: flex; gap: 6px; max-width: 360px; }
			.sub .credit-row button { white-space: nowrap; }
			.sub .merge-panel { border-left: 3px solid var(--accent); padding: 4px 0 2px 10px; display: grid; gap: 6px; }
			.sub .merge-head { font-weight: bold; font-size: 13px; }

			/* Ideas on the board: one line each. */
			.idea {
				display: grid; grid-template-columns: 44px minmax(0, 1fr) 130px 110px 120px 60px; gap: 6px; align-items: center;
				background: var(--panel); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px;
			}
			.idea .votes { font-family: var(--pixel); font-size: 10px; color: var(--accent); text-align: center; }
			.idea details { grid-column: 2 / -1; }
			.idea details summary { cursor: pointer; font-size: 12px; opacity: 0.75; }
			.idea details textarea { margin-top: 4px; }

			/* Players: a grid of tiles. */
			.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
			.player { background: var(--panel); border-radius: 8px; padding: 8px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 10px; align-content: start; }
			.player img { width: 56px; height: 56px; background: rgba(255, 255, 255, 0.08); border-radius: 6px; image-rendering: pixelated; }
			.player .name { font-weight: bold; font-size: 15px; }
			.player .swatches { display: flex; gap: 3px; margin-top: 3px; }
			.player .swatches span { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.6); }
			.player .buttons { grid-column: 1 / -1; display: flex; gap: 5px; flex-wrap: wrap; }
			.player .warn { grid-column: 1 / -1; font-size: 12px; background: rgba(255, 224, 102, 0.15); border-left: 3px solid var(--yellow); padding: 3px 6px; }
			.player .editor { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
			.player .editor .wide { grid-column: 1 / -1; }
			.player .editor .colours { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
			.player a { color: #fff; font-size: 12px; }

			/* Scores: one line each, with the shot by shot behind "Details". */
			.score {
				display: grid; grid-template-columns: 64px 150px 210px 80px 90px minmax(0, 1fr) 190px; gap: 8px; align-items: center;
				background: var(--panel); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px;
			}
			.score .points { font-family: var(--pixel); font-size: 12px; color: var(--yellow); }
			.score .flags { display: flex; gap: 4px; flex-wrap: wrap; }
			.flag { background: var(--bad); color: var(--ink); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
			.score .buttons { display: flex; gap: 4px; justify-content: end; }
			.score > details, .score .more { grid-column: 1 / -1; }
			.score > details summary { cursor: pointer; font-size: 12px; opacity: 0.75; }
			.score .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.flag.seen { background: rgba(255, 255, 255, 0.15); color: #fff; }
			.score.hidden-score { opacity: 0.6; }
			.stats { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 13px; margin: 4px 0; }
			.shots { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0; }
			.shots span { width: 12px; height: 12px; border-radius: 2px; background: rgba(255, 255, 255, 0.2); }
			.shots .in { background: var(--good); }
			.shots .three { box-shadow: inset 0 0 0 2px var(--yellow); }

			#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); border-radius: 6px; padding: 10px 14px; font-size: 11px; z-index: 10; }

			@media (max-width: 760px) {
				h1 { width: 100%; }
				.sub { grid-template-columns: 1fr; }
				.sub .fields { grid-template-columns: 1fr; }
				.sub .actions .danger { margin-top: 0; }
				.idea { grid-template-columns: 36px minmax(0, 1fr) 96px; }
				.idea > select:first-of-type { grid-column: 2 / -1; }
				.idea .credit, .idea .save { grid-column: auto; }
				.score { grid-template-columns: 60px 1fr auto; }
				.score .when, .score .mode, .score .made { display: none; }
				.score .flags { grid-column: 1 / -1; }
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<h1>Orson's admin</h1>
				<nav>
					<button type="button" id="tab-inbox" aria-selected="true">Inbox <span id="inbox-count"></span></button>
					<button type="button" id="tab-ideas" aria-selected="false">Ideas</button>
					<button type="button" id="tab-players" aria-selected="false">Players</button>
					<button type="button" id="tab-scores" aria-selected="false">Scores</button>
				</nav>
			</header>
			<section id="inbox"></section>
			<section id="ideas" hidden></section>
			<section id="players" hidden></section>
			<section id="scores" hidden></section>
			<div id="toast" hidden></div>
		</main>

		<script type="module">
			const STATUSES = ["idea", "planned", "building", "done", "hidden"];
			// Ideas on the board, grouped in this order within each game or app.
			const STATUS_GROUPS = [
				["building", "Building now", true],
				["planned", "Planned", true],
				["idea", "Ideas", true],
				["done", "Done", false],
				["hidden", "Hidden", false],
			];
			const PARTS = ["skin", "hair", "jersey", "team", "shoes"];
			let data = { submissions: [], ideas: [], apps: [], players: [], scores: [] };
			// Pictures and the builder live on the main site (a different port when testing locally).
			const SITE = location.hostname === "localhost" ? "http://localhost:5173" : "";
			// What's open stays open when the page redraws after a change.
			const openGroups = new Set();

			const el = (tag, props = {}, ...children) => {
				const node = Object.assign(document.createElement(tag), props);
				node.append(...children.filter((c) => c != null && c !== false));
				return node;
			};
			const field = (label, input, className = "") => el("label", { className: `field ${className}`.trim() }, el("span", { textContent: label }), input);
			const appName = (slug) => data.apps.find((a) => a.slug === slug)?.name ?? slug;
			const appSelect = (value) =>
				el("select", {}, ...data.apps.map((a) => el("option", { value: a.slug, textContent: a.name, selected: a.slug === value })));
			// A heading that folds away, remembered by key.
			function group(key, title, count, open, ...children) {
				const d = el("details", { className: "group", open: openGroups.has(key) || (open && !openGroups.has(`-${key}`)) },
					el("summary", {}, title, " ", el("span", { className: "count", textContent: `(${count})` })), ...children);
				d.addEventListener("toggle", () => {
					openGroups.delete(d.open ? `-${key}` : key);
					openGroups.add(d.open ? key : `-${key}`);
				});
				return d;
			}

			function toast(message) {
				const t = document.getElementById("toast");
				t.textContent = message;
				t.hidden = false;
				clearTimeout(toast.timer);
				toast.timer = setTimeout(() => (t.hidden = true), 2500);
			}

			async function api(path, body) {
				const res = await fetch(`/api/admin/${path}`, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
				const out = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(out.error || `Error ${res.status}`);
				return out;
			}
			// Runs an admin action, says how it went, and redraws.
			const run = (fn, done) => async () => {
				try {
					await fn();
					toast(typeof done === "function" ? done() : done);
					await load();
				} catch (err) {
					toast(err.message);
				}
			};

			async function load() {
				const y = scrollY;
				data = await api("inbox");
				renderInbox();
				renderIdeas();
				renderPlayers();
				renderScores();
				scrollTo(0, y);
			}

			const modeName = (s) => (s.mode === "survival" ? "Sudden death" : s.mode === "around" ? "Around the world" : "Time attack");
			// Around the world scores are times in tenths of a second.
			const scoreText = (s) => (s.mode === "around" ? `${(s.score / 10).toFixed(1)}s` : String(s.score));
			// Odd-looking scores Orson hasn't looked at yet. They're on the board until he hides them.
			const suspicious = (s) => s.status === "shown" && !s.checked && JSON.parse(s.flags).length > 0;

			// ---------- Inbox: everything that needs a decision ----------

			function renderInbox() {
				const box = document.getElementById("inbox");
				const requests = data.players.filter((p) => p.status === "new");
				// One line per player on a device and game mode, like their row on the leaderboard.
				const byPlayer = new Map();
				for (const s of data.scores.filter(suspicious)) {
					const key = `${s.device} ${s.player} ${s.mode}`;
					byPlayer.set(key, [...(byPlayer.get(key) ?? []), s]);
				}
				const odd = [...byPlayer.values()];
				const total = data.submissions.length + requests.length + odd.length;
				document.getElementById("inbox-count").textContent = total ? `(${total})` : "";
				box.replaceChildren();
				if (!total) return box.append(el("div", { className: "empty", innerHTML: "All caught up!<br>Nothing needs a look." }));
				box.append(
					el(
						"div",
						{ className: "summary" },
						data.submissions.length ? el("span", { textContent: `${data.submissions.length} new ideas` }) : null,
						requests.length ? el("span", { textContent: `${requests.length} player requests` }) : null,
						odd.length ? el("span", { textContent: `${odd.length} odd scores` }) : null,
					),
				);
				if (requests.length) box.append(el("h2", { textContent: `Player requests (${requests.length})` }), el("div", { className: "tiles" }, ...requests.map(playerTile)));
				if (data.submissions.length) {
					box.append(el("h2", { textContent: `New ideas (${data.submissions.length})` }));
					for (const [key, title, items] of ideaGroups()) box.append(group(`inbox ${key}`, title, items.length, true, ...items.map(submissionCard)));
				}
				if (odd.length) box.append(el("h2", { textContent: `Scores that look odd (${odd.length})` }), ...odd.map((list) => (list.length === 1 ? scoreRow(list[0]) : playerScoresRow(list))));
			}

			// New ideas grouped by what to do with them: new for the board, each existing idea they'd join,
			// ones that need a decision, and suggested rejects. Matching titles sit together.
			function ideaGroups() {
				const groups = new Map();
				const add = (key, title, s) => {
					if (!groups.has(key)) groups.set(key, [key, title, []]);
					groups.get(key)[2].push(s);
				};
				for (const s of data.submissions) {
					const into = s.merge_into && data.ideas.find((i) => i.id === s.merge_into);
					if (into) add(`merge ${into.id}`, `Add to "${into.title}"`, s);
					else if (s.note?.startsWith("Reject")) add("reject", "Suggested: reject", s);
					else if (s.note?.startsWith("Add to the board")) add("new", "New for the board", s);
					else add("decide", "Needs a decision", s);
				}
				const order = (key) => (key === "new" ? 0 : key.startsWith("merge") ? 1 : key === "decide" ? 2 : 3);
				const list = [...groups.values()].sort((a, b) => order(a[0]) - order(b[0]) || a[1].localeCompare(b[1]));
				for (const g of list) g[2].sort((a, b) => (a.title ?? a.text).localeCompare(b.title ?? b.text) || a.id - b.id);
				return list;
			}

			function submissionCard(s) {
				// A tidied-up draft if there is one, otherwise their own words.
				const title = el("input", { type: "text", value: s.title ?? s.text.slice(0, 80), maxLength: 80 });
				const description = el("textarea", { value: s.description ?? s.text, maxLength: 500, rows: 2 });
				const app = appSelect(s.app);
				// Who the board credits for it: any name, or empty for none. Their nickname is one tap away.
				const credit = el("input", { type: "text", maxLength: 60, placeholder: "No credit" });
				const creditRow = el(
					"div",
					{ className: "credit-row" },
					credit,
					s.nickname ? el("button", { type: "button", textContent: `Use "${s.nickname}"`, onclick: () => (credit.value = s.nickname) }) : null,
				);
				const mergeInto = el(
					"select",
					{},
					el("option", { value: "", textContent: "Add to an idea…" }),
					...data.ideas.filter((i) => i.status !== "hidden").map((i) => el("option", { value: i.id, textContent: `${appName(i.app)}: ${i.title}`, selected: i.id === s.merge_into })),
				);
				const act = (action, extra, done) => run(() => api(`submissions/${s.id}`, { action, ...extra }), done);
				// Adding it to an existing idea: that idea's title and description to edit, and whether it
				// counts as an upvote and credits the sender. Shown once an idea is picked, in place of the
				// fields for a new idea.
				const mergeTitle = el("input", { type: "text", maxLength: 80 });
				const mergeDescription = el("textarea", { maxLength: 500, rows: 2 });
				const upvote = el("input", { type: "checkbox", checked: true });
				const creditSender = el("input", { type: "checkbox", checked: !!s.nickname });
				const mergeHeading = el("div", { className: "merge-head" });
				const mergePanel = el(
					"div",
					{ className: "merge-panel", hidden: true },
					mergeHeading,
					el("div", { className: "fields" }, field("Title", mergeTitle, "wide"), field("Description", mergeDescription, "wide")),
					el("label", { className: "check" }, upvote, "Count it as an upvote"),
					s.nickname ? el("label", { className: "check" }, creditSender, `Credit "${s.nickname}" too`) : null,
				);
				const newFields = el(
					"div",
					{ className: "fields" },
					field("Title", title),
					field("Game or app", app),
					field("Description", description, "wide"),
					el("div", { className: "field wide" }, el("span", { textContent: "Credit on the board" }), creditRow),
				);
				const showMerge = () => {
					const idea = data.ideas.find((i) => String(i.id) === mergeInto.value);
					mergePanel.hidden = !idea;
					newFields.hidden = !!idea;
					if (!idea) return;
					mergeHeading.textContent = `Adding to "${idea.title}" (${appName(idea.app)} · ▲${idea.votes}${idea.credit ? ` · credit: ${idea.credit}` : ""})`;
					mergeTitle.value = idea.title;
					mergeDescription.value = idea.description;
				};
				mergeInto.addEventListener("change", showMerge);
				showMerge();
				const headline = el("h3", { textContent: title.value });
				title.addEventListener("input", () => (headline.textContent = title.value));
				// The button the suggestion points to gets an outline.
				const suggested = s.merge_into ? "merge" : s.note?.startsWith("Reject") ? "reject" : s.note?.startsWith("Add to the board") ? "add" : null;
				const mark = (which, className = "") => (suggested === which ? `${className} suggested`.trim() : className);
				return el(
					"div",
					{ className: "sub" },
					el(
						"div",
						{},
						el("div", { className: "meta", textContent: `${appName(s.app)} · ${s.nickname ? `from ${s.nickname}` : "no name"} · ${s.created_at.slice(0, 10)}` }),
						headline,
						el("p", { className: "quote", textContent: `They wrote: "${s.text}"` }),
						s.note ? el("p", { className: "note", textContent: s.note }) : null,
						newFields,
						mergePanel,
					),
					el(
						"div",
						{ className: "actions" },
						el("button", {
							type: "button",
							className: mark("add", "primary"),
							textContent: "Add to board",
							onclick: () => act("approve", { title: title.value, description: description.value, app: app.value, credit: credit.value.trim() }, "On the board!")(),
						}),
						mergeInto,
						el("button", {
							type: "button",
							className: mark("merge"),
							textContent: "Add to that idea",
							onclick: () =>
								mergeInto.value
									? act(
											"merge",
											{ ideaId: mergeInto.value, title: mergeTitle.value, description: mergeDescription.value, upvote: upvote.checked, credit: creditSender.checked },
											"Added to idea",
										)()
									: toast("Pick an idea first"),
						}),
						el("button", { type: "button", className: mark("reject", "danger"), textContent: "Reject", onclick: act("reject", {}, "Rejected") }),
					),
				);
			}

			// ---------- Ideas on the board ----------

			function renderIdeas() {
				const box = document.getElementById("ideas");
				box.replaceChildren();
				if (!data.ideas.length) return box.append(el("div", { className: "empty", textContent: "No ideas on the board yet." }));
				for (const app of data.apps) {
					const ideas = data.ideas.filter((i) => i.app === app.slug);
					if (!ideas.length) continue;
					box.append(el("h2", { textContent: `${app.name} (${ideas.length})` }));
					for (const [status, title, open] of STATUS_GROUPS) {
						const list = ideas.filter((i) => i.status === status).sort((a, b) => b.votes - a.votes || a.title.localeCompare(b.title));
						if (list.length) box.append(group(`ideas ${app.slug} ${status}`, title, list.length, open, ...list.map(ideaRow)));
					}
				}
			}

			function ideaRow(idea) {
				const title = el("input", { type: "text", value: idea.title, maxLength: 80 });
				const description = el("textarea", { value: idea.description, maxLength: 500, rows: 2 });
				const credit = el("input", { type: "text", value: idea.credit ?? "", maxLength: 60, placeholder: "No credit" });
				const status = el("select", {}, ...STATUSES.map((s) => el("option", { value: s, textContent: s, selected: s === idea.status })));
				// Which game or app it's under: change it and save to move the idea there.
				const app = appSelect(idea.app);
				app.title = "Game or app";
				return el(
					"div",
					{ className: "idea" },
					el("div", { className: "votes", title: "Votes", textContent: `▲${idea.votes}` }),
					title,
					app,
					status,
					el("div", { className: "credit" }, credit),
					el("button", {
						type: "button",
						className: "primary save",
						textContent: "Save",
						onclick: run(() => api(`ideas/${idea.id}`, { title: title.value, description: description.value, credit: credit.value, status: status.value, app: app.value }), () => (app.value === idea.app ? "Saved" : `Moved to ${appName(app.value)}`)),
					}),
					el("details", {}, el("summary", { textContent: idea.description ? `Description: ${idea.description.slice(0, 90)}${idea.description.length > 90 ? "…" : ""}` : "Add a description" }), description),
				);
			}

			// ---------- Players ----------

			function renderPlayers() {
				const box = document.getElementById("players");
				box.replaceChildren();
				if (!data.players.length) return box.append(el("div", { className: "empty", innerHTML: "No players yet.<br>They're made at /players/" }));
				const by = (status) => data.players.filter((p) => p.status === status).sort((a, b) => a.name.localeCompare(b.name));
				const sections = [
					["new", "Requests waiting", true],
					["approved", "In the game", true],
					["hidden", "Hidden", false],
				];
				for (const [status, title, open] of sections) {
					const list = by(status);
					if (list.length) box.append(group(`players ${status}`, title, list.length, open, el("div", { className: "tiles" }, ...list.map(playerTile))));
				}
			}

			// A player's face in their own colours, drawn by the same code as the game. Until it's
			// drawn (or if it can't be), the plain body shows.
			let recolorKit;
			const kit = () => (recolorKit ??= import(`${SITE}/players/recolor.js`));
			let basesList;
			const bases = () => (basesList ??= kit().then(({ loadBases }) => loadBases(`${SITE}/`)));
			function paintFace(img, p) {
				kit()
					.then(async ({ loadBase, thumbnail }) => {
						const base = (await bases()).find((b) => b.id === p.base);
						if (!base) return;
						const loaded = await loadBase(base, `${SITE}/`);
						const colours = { skin: p.skin, hair: p.hair, jersey: p.jersey, team: p.team, shoes: p.shoes, number: p.number ?? "", teamName: p.team_name };
						img.src = thumbnail(loaded, colours, 112).toDataURL();
					})
					.catch(() => {});
			}

			// A request that looks like someone already in the game: the same name, or the same look.
			function lookalike(p) {
				const others = data.players.filter((o) => o.id !== p.id && o.status === "approved");
				const sameName = others.find((o) => o.name.toLowerCase() === p.name.toLowerCase());
				if (sameName) return `Same name as ${sameName.name}, who's already in the game.`;
				const sameLook = others.find((o) => o.base === p.base && PARTS.every((part) => o[part] === p[part]));
				if (sameLook) return `Looks the same as ${sameLook.name}, who's already in the game.`;
				return null;
			}

			function playerTile(p) {
				const face = el("img", { src: `${SITE}/assets/characters/bases/${p.base}/thumb.webp`, alt: "", width: 56, height: 56 });
				paintFace(face, p);
				const save = (body, done) => run(() => api(`players/${p.id}`, { name: p.name, ...body }), done);
				const warn = p.status === "new" ? lookalike(p) : null;
				const editor = playerEditor(p, face);
				editor.hidden = true;
				return el(
					"div",
					{ className: "player" },
					face,
					el(
						"div",
						{},
						el("div", { className: "name", textContent: p.name }),
						el("div", { className: "meta", textContent: `${p.base} · ${p.team_name} ${p.number ? `#${p.number}` : "(no number)"} · ${p.created_at.slice(0, 10)}` }),
						el("div", { className: "swatches" }, ...PARTS.map((part) => el("span", { title: part, style: `background:${p[part]}` }))),
					),
					warn ? el("div", { className: "warn", textContent: warn }) : null,
					el(
						"div",
						{ className: "buttons" },
						p.status !== "approved" ? el("button", { type: "button", className: "primary", textContent: "Put in game", onclick: save({ action: "approve" }, "In the game!") }) : null,
						p.status !== "hidden" ? el("button", { type: "button", textContent: "Hide", onclick: save({ action: "hide" }, "Hidden") }) : null,
						el("button", { type: "button", textContent: "Edit", onclick: () => (editor.hidden = !editor.hidden) }),
					),
					editor,
				);
			}

			// Everything about a player: name, body, colours, number, team and where they are.
			function playerEditor(p, face) {
				const name = el("input", { type: "text", value: p.name, maxLength: 12 });
				const base = el("select", {}, el("option", { value: p.base, textContent: p.base, selected: true }));
				bases().then((list) => base.replaceChildren(...list.map((b) => el("option", { value: b.id, textContent: b.name, selected: b.id === p.base })))).catch(() => {});
				const colours = Object.fromEntries(PARTS.map((part) => [part, el("input", { type: "color", value: p[part], title: part })]));
				const number = el("input", { type: "text", value: p.number ?? "", maxLength: 2, placeholder: "None", inputMode: "numeric" });
				const team = el("input", { type: "text", value: p.team_name, maxLength: 12 });
				const status = el(
					"select",
					{},
					...[["new", "Waiting"], ["approved", "In the game"], ["hidden", "Hidden"]].map(([v, t]) => el("option", { value: v, textContent: t, selected: v === p.status })),
				);
				// The face updates as things change, before saving.
				const current = () => ({ ...p, base: base.value, ...Object.fromEntries(PARTS.map((part) => [part, colours[part].value])), number: number.value, team_name: team.value.toUpperCase() });
				for (const input of [base, ...Object.values(colours), number, team]) input.addEventListener("input", () => paintFace(face, current()));
				const look = () => {
					const c = current();
					const q = new URLSearchParams({ base: c.base, name: name.value });
					for (const part of PARTS) q.set(part, c[part].slice(1));
					if (c.number) q.set("number", c.number);
					q.set("teamName", c.team_name);
					return `${SITE}/players/?${q}`;
				};
				const action = { new: "unapprove", approved: "approve", hidden: "hide" };
				return el(
					"div",
					{ className: "editor" },
					field("Name", name),
					field("Body", base),
					el("div", { className: "colours" }, ...PARTS.map((part) => field(part, colours[part]))),
					field("Number", number),
					field("Team name", team),
					field("Where", status, "wide"),
					el(
						"div",
						{ className: "buttons wide", style: "display:flex;gap:5px;flex-wrap:wrap;align-items:center" },
						el("button", {
							type: "button",
							className: "primary",
							textContent: "Save",
							onclick: run(
								() =>
									api(`players/${p.id}`, {
										action: action[status.value],
										name: name.value,
										base: base.value,
										colours: Object.fromEntries(PARTS.map((part) => [part, colours[part].value])),
										number: number.value.trim(),
										teamName: team.value,
									}),
								"Saved",
							),
						}),
						el("a", { href: "#", textContent: "See them move ▸", onclick: (e) => (e.preventDefault(), open(look(), "_blank")) }),
						el("span", { style: "flex:1" }),
						el("button", {
							type: "button",
							className: "danger",
							textContent: "Delete",
							onclick: () => confirm(`Delete ${p.name} for good?`) && run(() => api(`players/${p.id}`, { action: "delete" }), "Deleted")(),
						}),
					),
				);
			}

			// ---------- Scores ----------

			// Odd ones not yet looked at first, then the last two weeks.
			function renderScores() {
				const box = document.getElementById("scores");
				box.replaceChildren();
				if (!data.scores.length) return box.append(el("div", { className: "empty", textContent: "No scores yet." }));
				for (const s of data.scores) box.append(scoreRow(s));
			}

			// Several odd scores from one player: checked together, each one still there to open.
			function playerScoresRow(list) {
				const best = list.reduce((a, b) => ((list[0].mode === "around" ? b.score < a.score : b.score > a.score) ? b : a));
				const flags = new Map();
				for (const s of list)
					for (const f of JSON.parse(s.flags)) {
						const kind = f.replace(/\d+/g, "N"); // "Nx this device's best" from several games is one kind
						flags.set(kind, [...(flags.get(kind) ?? []), f]);
					}
				const all = (action, done) => run(async () => {
					for (const s of list) await api(`scores/${s.id}`, { action });
				}, done);
				return el(
					"div",
					{ className: "score" },
					el("span", { className: "points", textContent: scoreText(best) }),
					el("b", { textContent: best.nickname }),
					el("span", { className: "mode meta", textContent: modeName(best) }),
					el("span", { className: "made meta", textContent: `${list.length} games` }),
					el("span", { className: "when meta", textContent: list[0].created_at.slice(0, 10) }),
					el("div", { className: "flags" }, ...[...flags.values()].map((fs) => el("span", { className: "flag", textContent: fs.length > 1 ? `${fs[0]} · ${fs.length} games` : fs[0] }))),
					el(
						"div",
						{ className: "buttons" },
						el("button", { type: "button", className: "primary", textContent: "All fine", onclick: all("show", `Kept ${list.length} scores`) }),
						el("button", { type: "button", className: "danger", textContent: "Hide all", onclick: all("hide", `Hid ${list.length} scores`) }),
					),
					el("details", {}, el("summary", { textContent: "Each game" }), ...list.map(scoreRow)),
				);
			}

			function scoreRow(s) {
				const flags = JSON.parse(s.flags);
				const log = JSON.parse(s.log);
				const gaps = log.slice(1).map((shot, i) => shot[0] - log[i][0]);
				const fastest = gaps.length ? Math.min(...gaps).toFixed(1) : "-";
				const odd = suspicious(s);
				const act = (action, done) => run(() => api(`scores/${s.id}`, { action }), done);
				// Who they played as: a built-in player's name, or "Own player" for one made on their device.
				const who = /^me\d+$/.test(s.player) ? "own player" : s.player;
				const more = el(
					"div",
					{ className: "more", hidden: true },
					el(
						"div",
						{ className: "stats" },
						el("span", { textContent: `Threes made: ${s.threes}` }),
						el("span", { textContent: `Fastest gap: ${fastest}s` }),
						el("span", { textContent: `Sent after: ${Math.round(s.real_seconds)}s` }),
						el("span", { textContent: `Played with: ${s.input ?? "?"}` }),
						s.hidden_tab ? el("span", { textContent: "Tab hidden mid-game" }) : null,
					),
					el(
						"div",
						{ className: "shots", title: "Each shot in order: green went in, yellow edge was a three" },
						...log.map((shot) => el("span", { className: `${shot[2] ? "in" : ""} ${shot[1] ? "three" : ""}`, title: `${shot[0]}s, timing ${shot[3]}` })),
					),
				);
				return el(
					"div",
					{ className: `score${s.status === "hidden" ? " hidden-score" : ""}` },
					el("span", { className: "points", textContent: scoreText(s) }),
					el("b", { className: "who", textContent: s.nickname }),
					el("span", { className: "mode meta", textContent: `${modeName(s)} · ${who}` }),
					el("span", { className: "made meta", textContent: `${s.made}/${s.shots} made` }),
					el("span", { className: "when meta", textContent: s.created_at.slice(5, 16).replace("T", " ") }),
					// Flags already looked at are greyed out.
					el(
						"div",
						{ className: "flags" },
						s.status === "hidden" ? el("span", { className: "meta", textContent: "Hidden" }) : null,
						...flags.map((f) => el("span", { className: odd ? "flag" : "flag seen", textContent: f })),
					),
					el(
						"div",
						{ className: "buttons" },
						el("button", { type: "button", textContent: "More", onclick: () => (more.hidden = !more.hidden) }),
						odd ? el("button", { type: "button", className: "primary", textContent: "Fine", onclick: act("show", "Kept on the board") }) : null,
						s.status === "hidden"
							? el("button", { type: "button", className: "primary", textContent: "Show", onclick: act("show", "On the board") })
							: el("button", { type: "button", className: "danger", textContent: "Hide", onclick: act("hide", "Hidden") }),
					),
					more,
				);
			}

			const TABS = ["inbox", "ideas", "players", "scores"];
			for (const section of TABS) {
				document.getElementById(`tab-${section}`).addEventListener("click", () => {
					for (const t of TABS) {
						document.getElementById(`tab-${t}`).setAttribute("aria-selected", String(t === section));
						document.getElementById(t).hidden = t !== section;
					}
				});
			}

			load().catch((err) => {
				document.getElementById("inbox").replaceChildren(el("div", { className: "empty", textContent: err.message }));
			});
		</script>
	</body>
</html>
