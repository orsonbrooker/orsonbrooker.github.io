<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>Admin | Orson Brooker</title>
		<link rel="icon" href="/favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
		<style>
			:root {
				--bg: #a6798e;
				--ink: #2b1622;
				--panel: rgba(43, 22, 34, 0.86);
				--accent: #f08a3c;
				--good: #3ddc84;
				--bad: #ff6b6b;
				--pixel: "Press Start 2P", ui-monospace, monospace;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				padding: 16px;
				background: var(--bg);
				color: #fff;
				font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
				font-size: 16px;
			}
			main { max-width: 860px; margin: 0 auto; }
			h1, h2, nav button, .pixel { font-family: var(--pixel); }
			h1 { font-size: clamp(16px, 4vw, 24px); text-shadow: 3px 3px 0 var(--ink); margin: 8px 0 16px; }
			h2 { font-size: 13px; margin: 24px 0 12px; }
			nav { display: flex; gap: 8px; margin-bottom: 16px; }
			nav button { flex: 1; }
			button {
				font: inherit;
				border: 0;
				border-radius: 6px;
				padding: 10px 12px;
				background: var(--panel);
				color: #fff;
				cursor: pointer;
				box-shadow: 3px 3px 0 var(--ink);
			}
			button.primary { background: var(--accent); color: var(--ink); }
			button.danger { background: var(--bad); color: var(--ink); }
			nav button[aria-selected="true"] { background: var(--accent); color: var(--ink); }
			.card { background: var(--panel); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
			.meta { font-size: 13px; opacity: 0.8; margin-bottom: 8px; }
			.quote { font-size: 18px; margin: 0 0 12px; white-space: pre-wrap; }
			.draft-note { margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid #ffe066; background: rgba(255, 224, 102, 0.1); font-size: 15px; }
			/* Inbox ideas: details on the left, actions down the right (stacked underneath on a phone). */
			main:has(.sub-card) { max-width: 1100px; }
			.sub-card { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 20px; }
			.sub-title { font-size: 20px; margin: 0 0 4px; }
			.sub-quote { margin: 0 0 10px; font-size: 14px; opacity: 0.75; white-space: pre-wrap; }
			.sub-fields { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 8px 10px; }
			.sub-fields label { margin: 0; }
			.sub-fields label span { display: block; font-size: 12px; margin-bottom: 3px; opacity: 0.8; }
			.sub-fields .wide { grid-column: 1 / -1; }
			.sub-fields textarea { min-height: 48px; }
			.sub-actions { display: flex; flex-direction: column; gap: 8px; }
			.sub-actions .danger { margin-top: auto; }
			.sub-actions .suggested { outline: 3px solid #ffe066; outline-offset: 2px; }
			@media (max-width: 700px) {
				.sub-card { grid-template-columns: 1fr; gap: 12px; }
				.sub-fields { grid-template-columns: 1fr; }
				.sub-actions .danger { margin-top: 0; }
			}
			label { display: block; font-size: 13px; margin: 8px 0 4px; opacity: 0.9; }
			input[type="text"], textarea, select {
				width: 100%;
				font: inherit;
				padding: 8px;
				border-radius: 4px;
				border: 2px solid var(--ink);
				background: #fff;
				color: var(--ink);
			}
			textarea { min-height: 60px; }
			.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 12px; }
			.row > * { flex: 1 1 auto; }
			.check { display: flex; gap: 6px; align-items: center; font-size: 14px; margin-top: 8px; }
			.empty { text-align: center; padding: 32px; font-family: var(--pixel); font-size: 12px; line-height: 1.8; }
			.votes { font-family: var(--pixel); font-size: 12px; color: var(--accent); }
			.player { display: flex; gap: 12px; align-items: flex-start; }
			.player img { background: rgba(255, 255, 255, 0.1); border-radius: 6px; flex: none; }
			.player-info { flex: 1; min-width: 0; }
			.player a { color: #fff; font-size: 14px; }
			.chips { display: flex; gap: 6px; margin: 4px 0 8px; }
			.chips .number { font-family: var(--pixel); font-size: 12px; align-self: center; margin-left: 4px; }
			.chips span { width: 24px; height: 24px; border-radius: 4px; border: 2px solid rgba(255, 255, 255, 0.7); }
			.lede { margin: -8px 0 16px; opacity: 0.9; }
			.suspect { display: inline-block; font-family: var(--pixel); font-size: 10px; background: #ffe066; color: var(--ink); border-radius: 4px; padding: 4px 6px; margin-left: 8px; vertical-align: middle; }
			.flag { display: inline-block; background: var(--bad); color: var(--ink); border-radius: 4px; padding: 3px 8px; margin: 0 6px 6px 0; font-size: 14px; }
			.score-big { font-family: var(--pixel); font-size: 20px; color: #ffe066; }
			.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 12px; font-size: 14px; margin: 8px 0; }
			.shots { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0; }
			.shots span { width: 14px; height: 14px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); }
			.shots .in { background: var(--good); }
			.shots .three { box-shadow: inset 0 0 0 2px #ffe066; }
			#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); }
		</style>
	</head>
	<body>
		<main>
			<h1>Orson's admin</h1>
			<p class="lede">The inbox has everything that needs a look: new ideas, new players and odd-looking scores.</p>
			<nav>
				<button type="button" id="tab-inbox" aria-selected="true">Inbox <span id="inbox-count"></span></button>
				<button type="button" id="tab-ideas" aria-selected="false">Ideas</button>
				<button type="button" id="tab-players" aria-selected="false">Players</button>
				<button type="button" id="tab-scores" aria-selected="false">Scores</button>
			</nav>
			<section id="inbox"></section>
			<section id="ideas" hidden></section>
			<section id="players" hidden></section>
			<section id="scores" hidden></section>
			<div id="toast" class="card pixel" hidden></div>
		</main>

		<script type="module">
			const STATUSES = ["idea", "planned", "building", "done", "hidden"];
			let data = { submissions: [], ideas: [], apps: [], players: [], scores: [] };
			// Pictures and the builder live on the main site (a different port when testing locally).
			const SITE = location.hostname === "localhost" ? "http://localhost:5173" : "";

			const el = (tag, props = {}, ...children) => {
				const node = Object.assign(document.createElement(tag), props);
				node.append(...children.filter((c) => c != null));
				return node;
			};
			const appName = (slug) => data.apps.find((a) => a.slug === slug)?.name ?? slug;
			const appSelect = (value) =>
				el("select", {}, ...data.apps.map((a) => el("option", { value: a.slug, textContent: a.name, selected: a.slug === value })));

			function toast(message) {
				const t = document.getElementById("toast");
				t.textContent = message;
				t.hidden = false;
				clearTimeout(toast.timer);
				toast.timer = setTimeout(() => (t.hidden = true), 2500);
			}

			async function api(path, body) {
				const res = await fetch(`/api/admin/${path}`, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
				const out = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(out.error || `Error ${res.status}`);
				return out;
			}

			async function load() {
				data = await api("inbox");
				renderInbox();
				renderIdeas();
				renderPlayers();
				renderScores();
			}

			// Sudden death scores are on their own leaderboard; time attack (the 60 second game) needs no label.
			const modeName = (s) => (s.mode === "survival" ? "Sudden death · " : s.mode === "around" ? "Around the world · " : "");
			// Around the world scores are times in tenths of a second.
			const scoreText = (s) => (s.mode === "around" ? `${(s.score / 10).toFixed(1)}s` : String(s.score));

			// Odd-looking scores Orson hasn't looked at yet. They're on the board until he hides them.
			const suspicious = (s) => s.status === "shown" && !s.checked && JSON.parse(s.flags).length > 0;

			// Everything that needs action, by kind.
			function renderInbox() {
				const box = document.getElementById("inbox");
				const players = data.players.filter((p) => p.status === "new");
				// One card per player on a device, like their row on the leaderboard.
				const byPlayer = new Map();
				for (const s of data.scores.filter(suspicious)) {
					const key = `${s.device} ${s.player} ${s.mode}`;
					byPlayer.set(key, [...(byPlayer.get(key) ?? []), s]);
				}
				const scores = [...byPlayer.values()];
				const total = data.submissions.length + players.length + scores.length;
				document.getElementById("inbox-count").textContent = total ? `(${total})` : "";
				box.replaceChildren();
				if (!total) {
					box.append(el("div", { className: "card empty", innerHTML: "All caught up!<br>Nothing needs a look." }));
					return;
				}
				const group = (title, items, card) => {
					if (!items.length) return;
					box.append(el("h2", { textContent: `${title} (${items.length})` }));
					for (const item of items) box.append(card(item));
				};
				group("New ideas", data.submissions, submissionCard);
				group("New players", players, playerCard);
				group("Scores that look odd", scores, (list) => (list.length === 1 ? scoreCard(list[0]) : playerScoresCard(list)));
			}

			// Several odd scores from one player (newest first): checked together, each one still there to open.
			function playerScoresCard(list) {
				const best = Math.max(...list.map((s) => s.score));
				const flags = new Map();
				for (const s of list) for (const f of JSON.parse(s.flags)) {
					const kind = f.replace(/\d+/g, "N"); // "All 33 shots made" and "All 31 shots made" are one kind
					flags.set(kind, [...(flags.get(kind) ?? []), f]);
				}
				const act = (action) => async () => {
					try {
						for (const s of list) await api(`scores/${s.id}`, { action });
						toast(action === "hide" ? `Hid ${list.length} scores` : `Kept ${list.length} scores on the board`);
						await load();
					} catch (err) {
						toast(err.message);
						await load();
					}
				};
				const details = el("details", {}, el("summary", { textContent: "See each game" }), ...list.map(scoreCard));
				return el(
					"div",
					{ className: "card" },
					el("div", { className: "meta", textContent: `${list.length} odd games · ${modeName(list[0])}played as ${list[0].player} · newest ${list[0].created_at.slice(0, 10)}` }),
					el(
						"div",
						{},
						el("span", { className: "score-big", textContent: `${best} ` }),
						el("b", { textContent: list[0].nickname }),
						el("span", { className: "suspect", textContent: "Suspicious" }),
					),
					...[...flags.values()].map((fs) => el("span", { className: "flag", textContent: fs.length > 1 ? `${fs[0]} · ${fs.length} games` : fs[0] })),
					el(
						"div",
						{ className: "row" },
						el("button", { type: "button", className: "primary", textContent: "All look fine", onclick: act("show") }),
						el("button", { type: "button", className: "danger", textContent: "Hide all", onclick: act("hide") }),
					),
					details,
				);
			}

			function submissionCard(s) {
				// A tidied-up draft if there is one, otherwise their own words.
				const title = el("input", { type: "text", value: s.title ?? s.text.slice(0, 80), maxLength: 80 });
				const description = el("textarea", { value: s.description ?? s.text, maxLength: 500 });
				const app = appSelect(s.app);
				const credit = el("input", { type: "checkbox" });
				const mergeInto = el(
					"select",
					{},
					el("option", { value: "", textContent: "Add to an existing idea…" }),
					...data.ideas.map((i) => el("option", { value: i.id, textContent: `${appName(i.app)}: ${i.title}`, selected: i.id === s.merge_into })),
				);
				const act = (action, extra = {}) => async () => {
					try {
						await api(`submissions/${s.id}`, { action, ...extra });
						toast(action === "reject" ? "Rejected" : action === "merge" ? "Added to idea" : "On the board!");
						await load();
					} catch (err) {
						toast(err.message);
					}
				};
				// Easy to scan: the idea as it would read on the board, what they actually wrote, and the
				// suggestion. The fields to change it sit below, and the actions down the right.
				const headline = el("h3", { className: "sub-title", textContent: title.value });
				title.addEventListener("input", () => (headline.textContent = title.value));
				const details = el(
					"div",
					{ className: "sub-main" },
					el("div", { className: "meta", textContent: `${appName(s.app)} · ${s.nickname ? `from ${s.nickname}` : "no name"} · ${s.created_at.slice(0, 10)}` }),
					headline,
					el("p", { className: "sub-quote", textContent: `They wrote: "${s.text}"` }),
					s.note ? el("p", { className: "draft-note", textContent: s.note }) : null,
					el(
						"div",
						{ className: "sub-fields" },
						el("label", {}, el("span", { textContent: "Title" }), title),
						el("label", {}, el("span", { textContent: "Game or app" }), app),
						el("label", { className: "wide" }, el("span", { textContent: "Description" }), description),
					),
					s.nickname ? el("label", { className: "check" }, credit, `Credit "${s.nickname}" on the board`) : null,
				);
				// The button the suggestion points to gets an outline: an existing idea to add it to, a
				// note starting "Reject", or one starting "Add to the board".
				const suggested = s.merge_into ? "merge" : s.note?.startsWith("Reject") ? "reject" : s.note?.startsWith("Add to the board") ? "add" : null;
				const mark = (which, className = "") => (suggested === which ? `${className} suggested`.trim() : className);
				const actions = el(
					"div",
					{ className: "sub-actions" },
					el("button", {
						type: "button",
						className: mark("add", "primary"),
						textContent: "Add to board",
						onclick: () => act("approve", { title: title.value, description: description.value, app: app.value, credit: credit.checked })(),
					}),
					...(data.ideas.length
						? [
								mergeInto,
								el("button", {
									type: "button",
									className: mark("merge"),
									textContent: "Add to that idea",
									onclick: () => (mergeInto.value ? act("merge", { ideaId: mergeInto.value })() : toast("Pick an idea first")),
								}),
							]
						: []),
					el("button", { type: "button", className: mark("reject", "danger"), textContent: "Reject", onclick: act("reject") }),
				);
				return el("div", { className: "card sub-card" }, details, actions);
			}

			function renderIdeas() {
				const box = document.getElementById("ideas");
				box.replaceChildren();
				if (!data.ideas.length) {
					box.append(el("div", { className: "card empty", textContent: "No ideas on the board yet." }));
					return;
				}
				for (const app of data.apps) {
					const ideas = data.ideas.filter((i) => i.app === app.slug);
					if (!ideas.length) continue;
					box.append(el("h2", { textContent: app.name }));
					for (const idea of ideas) {
						const title = el("input", { type: "text", value: idea.title, maxLength: 80 });
						const description = el("textarea", { value: idea.description, maxLength: 500 });
						const credit = el("input", { type: "text", value: idea.credit ?? "", maxLength: 20, placeholder: "No credit" });
						const status = el("select", {}, ...STATUSES.map((s) => el("option", { value: s, textContent: s, selected: s === idea.status })));
						box.append(
							el(
								"div",
								{ className: "card" },
								el("div", { className: "votes", textContent: `▲ ${idea.votes}` }),
								el("label", { textContent: "Title" }),
								title,
								el("label", { textContent: "Description" }),
								description,
								el(
									"div",
									{ className: "row" },
									el("div", {}, el("label", { textContent: "Status" }), status),
									el("div", {}, el("label", { textContent: "Credit" }), credit),
									el("button", {
										type: "button",
										className: "primary",
										textContent: "Save",
										onclick: async () => {
											try {
												await api(`ideas/${idea.id}`, { title: title.value, description: description.value, credit: credit.value, status: status.value });
												toast("Saved");
												await load();
											} catch (err) {
												toast(err.message);
											}
										},
									}),
								),
							),
						);
					}
				}
			}

			// Players made with the builder: approve to put them in the game, hide to take them out.
			function renderPlayers() {
				const box = document.getElementById("players");
				box.replaceChildren();
				if (!data.players.length) {
					box.append(el("div", { className: "card empty", innerHTML: "No players yet.<br>They're made at /players/" }));
					return;
				}
				for (const p of data.players) box.append(playerCard(p));
			}

			// A player's face in their own colours, drawn by the same code as the game. Until it's
			// drawn (or if it can't be), the plain body shows.
			let recolorKit;
			function paintFace(img, p) {
				recolorKit ??= import(`${SITE}/players/recolor.js`);
				recolorKit
					.then(async ({ loadBases, loadBase, thumbnail }) => {
						const base = (await loadBases(`${SITE}/`)).find((b) => b.id === p.base);
						if (!base) return;
						const loaded = await loadBase(base, `${SITE}/`);
						const colours = { skin: p.skin, hair: p.hair, jersey: p.jersey, team: p.team, shoes: p.shoes, number: p.number ?? "", teamName: p.team_name };
						img.src = thumbnail(loaded, colours, 128).toDataURL();
					})
					.catch(() => {});
			}

			function playerCard(p) {
				const name = el("input", { type: "text", value: p.name, maxLength: 12 });
				const face = el("img", { src: `${SITE}/assets/characters/bases/${p.base}/thumb.webp`, alt: "", width: 64, height: 64 });
				paintFace(face, p);
				const look = new URLSearchParams({ base: p.base, name: p.name });
				for (const part of ["skin", "hair", "jersey", "team", "shoes"]) look.set(part, p[part].slice(1));
				if (p.number) look.set("number", p.number);
				look.set("teamName", p.team_name);
				const act = (action) => async () => {
					if (action === "delete" && !confirm(`Delete ${p.name} for good?`)) return;
					try {
						await api(`players/${p.id}`, { action, name: name.value });
						toast(action === "approve" ? "In the game!" : action === "hide" ? "Hidden" : action === "delete" ? "Deleted" : "Saved");
						await load();
					} catch (err) {
						toast(err.message);
					}
				};
				return (
					el(
						"div",
						{ className: "card player" },
						face,
						el(
							"div",
							{ className: "player-info" },
							el("div", { className: "meta", textContent: `${p.status === "new" ? "Waiting" : p.status === "approved" ? "In the game" : "Hidden"} · ${p.base} · ${p.created_at.slice(0, 10)}` }),
							el(
								"div",
								{ className: "chips" },
								...["skin", "hair", "jersey", "team", "shoes"].map((part) => el("span", { title: part, style: `background:${p[part]}` })),
								el("b", { className: "number", textContent: `${p.team_name} ${p.number ? `#${p.number}` : "(no number)"}` }),
							),
							el("a", { href: `${SITE}/players/?${look}`, target: "_blank", textContent: "See them move ▸" }),
							el("label", { textContent: "Name" }),
							name,
							el(
								"div",
								{ className: "row" },
								p.status !== "approved" ? el("button", { type: "button", className: "primary", textContent: "Put in game", onclick: act("approve") }) : null,
								p.status === "approved" ? el("button", { type: "button", textContent: "Hide", onclick: act("hide") }) : null,
								el("button", { type: "button", textContent: "Save name", onclick: act("rename") }),
								el("button", { type: "button", className: "danger", textContent: "Delete", onclick: act("delete") }),
							),
						),
					)
				);
			}

			// Leaderboard scores: odd ones not yet looked at first, then the last two weeks.
			function renderScores() {
				const box = document.getElementById("scores");
				box.replaceChildren();
				if (!data.scores.length) {
					box.append(el("div", { className: "card empty", textContent: "No scores yet." }));
					return;
				}
				for (const s of data.scores) box.append(scoreCard(s));
			}

			function scoreCard(s) {
				const flags = JSON.parse(s.flags);
				const log = JSON.parse(s.log);
				const gaps = log.slice(1).map((shot, i) => shot[0] - log[i][0]);
				const fastest = gaps.length ? Math.min(...gaps).toFixed(1) : "-";
				const odd = suspicious(s);
				const act = (action) => async () => {
					try {
						await api(`scores/${s.id}`, { action });
						toast(action === "hide" ? "Hidden" : odd ? "Kept on the board" : "On the board");
						await load();
					} catch (err) {
						toast(err.message);
					}
				};
				const status = s.status === "shown" ? "On the board" : "Hidden";
				return (
					el(
						"div",
						{ className: "card" },
						el("div", { className: "meta", textContent: `${status} · ${s.created_at.slice(0, 16).replace("T", " ")} · ${modeName(s)}played as ${s.player}` }),
						el(
							"div",
							{},
							el("span", { className: "score-big", textContent: `${scoreText(s)} ` }),
							el("b", { textContent: s.nickname }),
							odd ? el("span", { className: "suspect", textContent: "Suspicious" }) : null,
						),
						...flags.map((f) => el("span", { className: "flag", textContent: f })),
						el(
							"div",
							{ className: "stats" },
							el("span", { textContent: `Shots: ${s.made}/${s.shots} (${s.shots ? Math.round((s.made / s.shots) * 100) : 0}%)` }),
							el("span", { textContent: `Threes made: ${s.threes}` }),
							el("span", { textContent: `Fastest gap: ${fastest}s` }),
							el("span", { textContent: `Sent after: ${Math.round(s.real_seconds)}s` }),
							el("span", { textContent: `Played with: ${s.input ?? "?"}` }),
							s.hidden_tab ? el("span", { textContent: "Tab hidden mid-game" }) : null,
						),
						el(
							"div",
							{ className: "shots", title: "Each shot in order: green went in, yellow edge was a three" },
							...log.map((shot) => el("span", { className: `${shot[2] ? "in" : ""} ${shot[1] ? "three" : ""}`, title: `${shot[0]}s, timing ${shot[3]}` })),
						),
						el(
							"div",
							{ className: "row" },
							odd ? el("button", { type: "button", className: "primary", textContent: "Looks fine", onclick: act("show") }) : null,
							s.status === "hidden" ? el("button", { type: "button", className: "primary", textContent: "Put back on the board", onclick: act("show") }) : null,
							s.status !== "hidden" ? el("button", { type: "button", className: "danger", textContent: "Hide", onclick: act("hide") }) : null,
						),
					)
				);
			}

			const TABS = ["inbox", "ideas", "players", "scores"];
			for (const section of TABS) {
				document.getElementById(`tab-${section}`).addEventListener("click", () => {
					for (const t of TABS) {
						document.getElementById(`tab-${t}`).setAttribute("aria-selected", String(t === section));
						document.getElementById(t).hidden = t !== section;
					}
				});
			}

			load().catch((err) => {
				document.getElementById("inbox").replaceChildren(el("div", { className: "card empty", textContent: err.message }));
			});
		</script>
	</body>
</html>
