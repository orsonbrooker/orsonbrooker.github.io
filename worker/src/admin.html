<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>Admin | Orson Brooker</title>
		<link rel="icon" href="/favicon.ico" />
		<style>
			:root {
				--bg: #a6798e;
				--ink: #2b1622;
				--panel: rgba(43, 22, 34, 0.88);
				--line: rgba(255, 255, 255, 0.12);
				--accent: #f08a3c;
				--yellow: #ffe066;
				--good: #3ddc84;
				--bad: #ff6b6b;
				--pixel: "Press Start 2P", ui-monospace, monospace;
			}
			* { box-sizing: border-box; }
			[hidden] { display: none !important; }
			body {
				margin: 0;
				padding: 0 12px 24px;
				background: var(--bg);
				color: #fff;
				font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
				font-size: 14px;
			}
			main { max-width: 1200px; margin: 0 auto; }
			h1, h2, nav a, .pixel { font-family: var(--pixel); }

			/* Header: title and tabs in one bar that stays at the top. */
			header {
				position: sticky; top: 0; z-index: 5;
				display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
				padding: 10px 0; background: var(--bg);
			}
			h1 { font-size: 14px; margin: 0; text-shadow: 2px 2px 0 var(--ink); }
			nav { display: flex; gap: 6px; flex: 1; }
			nav a { flex: 1; font-size: 10px; padding: 9px 8px; border-radius: 5px; color: #fff; text-decoration: none; text-align: center; }
			h2 { font-size: 11px; margin: 18px 0 8px; }
			.group { margin: 0 0 10px; }
			.group > summary { cursor: pointer; font-weight: bold; font-size: 15px; padding: 6px 2px; list-style: none; }
			.group > summary::before { content: "▸ "; opacity: 0.7; }
			.group[open] > summary::before { content: "▾ "; }
			.group > summary .count { opacity: 0.7; font-weight: normal; }

			button {
				font: inherit;
				border: 0;
				border-radius: 5px;
				padding: 6px 10px;
				background: rgba(255, 255, 255, 0.12);
				color: #fff;
				cursor: pointer;
			}
			button:hover { background: rgba(255, 255, 255, 0.2); }
			button.primary { background: var(--accent); color: var(--ink); }
			button.danger { background: var(--bad); color: var(--ink); }
			button.suggested { outline: 3px solid var(--yellow); outline-offset: 1px; }
			nav a { background: var(--panel); }
			nav a:hover { background: rgba(43, 22, 34, 0.7); }
			nav a[aria-current="page"] { background: var(--accent); color: var(--ink); }

			input[type="text"], textarea, select {
				width: 100%;
				font: inherit;
				padding: 5px 7px;
				border-radius: 4px;
				border: 1px solid var(--ink);
				background: #fff;
				color: var(--ink);
			}
			textarea { min-height: 38px; resize: vertical; }
			input[type="color"] { width: 100%; height: 30px; padding: 0; border: 1px solid var(--ink); border-radius: 4px; background: none; }
			.field span { display: block; font-size: 11px; margin-bottom: 2px; opacity: 0.75; }
			.check { display: flex; gap: 6px; align-items: center; font-size: 13px; }
			.meta { font-size: 12px; opacity: 0.75; }
			.empty { background: var(--panel); border-radius: 8px; text-align: center; padding: 24px; font-family: var(--pixel); font-size: 11px; line-height: 1.8; }
			.summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
			.summary span { background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
			/* The weekly digest (worker/src/digest.ts): one item at the top of the inbox. */
			.digest { background: var(--panel); border-left: 3px solid var(--yellow); border-radius: 8px; padding: 8px 10px; margin: 4px 0 10px; display: grid; gap: 6px; }
			.digest .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
			.digest .title { font-weight: bold; font-size: 15px; }
			.digest ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
			.digest li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
			.digest li.done { opacity: 0.5; }
			.digest .what { font-size: 12px; opacity: 0.75; }

			/* Inbox ideas: details on the left, actions on the right (stacked underneath on a phone). */
			.sub {
				display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 12px;
				background: var(--panel); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
			}
			.sub h3 { font-size: 16px; margin: 1px 0 2px; }
			.sub .quote { margin: 0 0 6px; font-size: 13px; opacity: 0.7; white-space: pre-wrap; }
			.sub .note { margin: 0 0 8px; padding: 4px 8px; border-left: 3px solid var(--yellow); background: rgba(255, 224, 102, 0.1); font-size: 13px; }
			.sub .fields { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px 8px; }
			.sub .fields .wide { grid-column: 1 / -1; }
			.sub .actions { display: flex; flex-direction: column; gap: 5px; }
			.sub .actions .danger { margin-top: auto; }
			.sub .actions .keep { margin-top: auto; }
			.sub .actions .keep + .danger { margin-top: 0; }
			/* Community teams (worker/src/teams.ts): a card each, with its kits. */
			.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
			.team-card { background: var(--panel); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
			.team-card .name { font-weight: bold; font-size: 16px; overflow-wrap: anywhere; }
			.team-card .kits { display: flex; gap: 10px; align-items: center; font-size: 12px; }
			.team-card .kit { display: inline-flex; gap: 2px; }
			.team-card .kit span { width: 12px; height: 20px; border: 2px solid #111; border-radius: 3px; }
			.team-card .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
			/* Kind words: compliments kept off the board. */
			.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
			.word { background: var(--panel); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
			.word blockquote { margin: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
			.word .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
			.sub .credit-row { display: flex; gap: 6px; max-width: 360px; }
			.sub .credit-row button { white-space: nowrap; }
			.sub .merge-panel { border-left: 3px solid var(--accent); padding: 4px 0 2px 10px; display: grid; gap: 6px; }
			.sub .merge-head { font-weight: bold; font-size: 13px; }

			/* Ideas on the board: one line each. */
			.idea .flag-link { grid-column: 2 / -1; display: flex; gap: 6px; align-items: center; font-size: 12px; }
			.idea .flag-link select { width: auto; max-width: 320px; padding: 2px 4px; font-size: 12px; }
			.feature .idea-link { grid-column: 1; display: flex; gap: 6px; align-items: center; font-size: 13px; }
			.feature .idea-link select { width: auto; max-width: 100%; min-width: 0; }
			.idea {
				display: grid; grid-template-columns: 44px minmax(0, 1fr) 130px 110px 120px 60px; gap: 6px; align-items: center;
				background: var(--panel); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px;
			}
			.idea .votes { font-family: var(--pixel); font-size: 10px; color: var(--accent); text-align: center; }
			.idea details { grid-column: 2 / -1; }
			.idea details summary { cursor: pointer; font-size: 12px; opacity: 0.75; }
			.idea details textarea { margin-top: 4px; }

			/* Players: a grid of tiles. */
			.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
			.player { background: var(--panel); border-radius: 8px; padding: 8px; display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 4px 10px; align-content: start; }
			.player img { width: 100px; height: 124px; object-fit: contain; object-position: bottom; background: rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 3px; }
			.player img.failed { outline: 2px solid var(--bad); }
			.player .name { font-weight: bold; font-size: 15px; }
			.player .swatches { display: flex; gap: 3px; margin-top: 3px; }
			.player .swatches span { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.6); }
			.player .buttons { grid-column: 1 / -1; display: flex; gap: 5px; flex-wrap: wrap; }
			.player .warn { grid-column: 1 / -1; font-size: 12px; background: rgba(255, 224, 102, 0.15); border-left: 3px solid var(--yellow); padding: 3px 6px; }
			.player .editor { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
			.player .editor .wide { grid-column: 1 / -1; }
			.player .editor .colours { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
			.player a { color: #fff; font-size: 12px; }

			/* Scores: one line each, with the shot by shot behind "Details". */
			.score {
				display: grid; grid-template-columns: 64px 150px 210px 80px 90px minmax(0, 1fr) minmax(190px, auto); gap: 8px; align-items: center;
				background: var(--panel); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px;
			}
			.score .points { font-family: var(--pixel); font-size: 12px; color: var(--yellow); }
			.score .flags { display: flex; gap: 4px; flex-wrap: wrap; }
			.features { display: grid; gap: 8px; max-width: 760px; }
			.feature { background: var(--panel); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
			.feature h3 { font-size: 16px; margin: 0; }
			.feature p { margin: 0; font-size: 13px; opacity: 0.8; grid-column: 1; }
			.feature .state { font-family: var(--pixel); font-size: 10px; border-radius: 4px; padding: 3px 6px; margin-left: 6px; vertical-align: 2px; }
			.feature .state.on { background: var(--accent); color: var(--ink); }
			.feature .state.off { background: rgba(255, 255, 255, 0.15); }
			.feature button { grid-column: 2; grid-row: 1 / span 4; min-width: 120px; }
			.flag { background: var(--bad); color: var(--ink); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
			.score .buttons { display: flex; gap: 4px; justify-content: end; white-space: nowrap; }
			.score > details, .score .more { grid-column: 1 / -1; }
			.score > details summary { cursor: pointer; font-size: 12px; opacity: 0.75; }
			.score .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.flag.seen { background: rgba(255, 255, 255, 0.15); color: #fff; }
			.score.hidden-score { opacity: 0.6; }
			.stats { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 13px; margin: 4px 0; }
			.rename { display: flex; gap: 6px; align-items: center; max-width: 380px; margin: 4px 0; }
			.shots { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0; }
			.shots span { width: 12px; height: 12px; border-radius: 2px; background: rgba(255, 255, 255, 0.2); }
			.shots .in { background: var(--good); }
			.shots .three { box-shadow: inset 0 0 0 2px var(--yellow); }

			#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); border-radius: 6px; padding: 10px 14px; font-size: 11px; z-index: 10; }

			@media (max-width: 760px) {
				h1 { width: 100%; }
				.sub { grid-template-columns: 1fr; }
				.sub .fields { grid-template-columns: 1fr; }
				.sub .actions .danger { margin-top: 0; }
				.idea { grid-template-columns: 36px minmax(0, 1fr) 96px; }
				.idea > select:first-of-type { grid-column: 2 / -1; }
				.idea .credit, .idea .save { grid-column: auto; }
				.score { grid-template-columns: 60px 1fr auto; }
				.score .when, .score .mode, .score .made { display: none; }
				.score .flags { grid-column: 1 / -1; }
			}

			/* Stats: tiles, charts by day, and how many saves use each feature. */
			.stat-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
			.tile { background: var(--panel); border-radius: 8px; padding: 12px; }
			.tile b { display: block; font-family: var(--pixel); font-size: 18px; margin: 6px 0 4px; }
			.tile span, .tile small { opacity: 0.75; }
			.panel { background: var(--panel); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
			.panel h3 { font-size: 15px; margin: 0 0 8px; }
			.panel p.note { opacity: 0.75; margin: 6px 0 0; }
			.chart { display: block; width: 100%; height: auto; }
			.chart .axis { stroke: var(--line); stroke-width: 1; }
			.chart .tick { fill: rgba(255, 255, 255, 0.6); font-size: 11px; }
			.chart .day:hover rect:not([fill="transparent"]) { opacity: 0.8; }
			.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
			.legend i, .bar i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
			.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
			.bars { display: grid; gap: 7px; }
			.bar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 8px; align-items: center; }
			.bar .track { height: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 0 4px 4px 0; overflow: hidden; }
			.bar .fill { height: 100%; background: #3987e5; border-radius: 0 4px 4px 0; }
			.bar .val { font-variant-numeric: tabular-nums; opacity: 0.85; }
		</style>
	</head>
	<body>
		<main>
			<header>
				<h1>Orson's admin</h1>
				<nav>
					<a href="/admin" id="tab-inbox" aria-current="page">Inbox <span id="inbox-count"></span></a>
					<a href="/admin/ideas" id="tab-ideas">Ideas</a>
					<a href="/admin/players" id="tab-players">Players</a>
					<a href="/admin/scores" id="tab-scores">Scores</a>
					<a href="/admin/teams" id="tab-teams">Teams</a>
					<a href="/admin/words" id="tab-words">Kind words</a>
					<a href="/admin/stats" id="tab-stats">Stats</a>
					<a href="/admin/flags" id="tab-flags">Flags</a>
				</nav>
			</header>
			<section id="inbox"></section>
			<section id="ideas" hidden></section>
			<section id="players" hidden></section>
			<section id="scores" hidden></section>
			<section id="teams" hidden></section>
			<section id="words" hidden></section>
			<section id="stats" hidden></section>
			<section id="flags" hidden></section>
			<div id="toast" hidden></div>
		</main>

		<script type="module">
			const STATUSES = ["idea", "planned", "building", "done", "hidden"];
			// Ideas on the board, grouped in this order within each game or app.
			const STATUS_GROUPS = [
				["building", "Building now", true],
				["planned", "Planned", true],
				["idea", "Ideas", true],
				["done", "Done", false],
				["hidden", "Hidden", false],
			];
			// "team" is the trim (and number); shorts of their own, or the team colour when not set
			const PARTS = ["skin", "hair", "jersey", "team", "shorts", "shoes"];
			let data = { submissions: [], ideas: [], apps: [], players: [], scores: [] };
			let flags = []; // feature flags (worker/src/flags.ts), each maybe linked to an idea
			// Pictures and the builder live on the main site (a different port when testing locally).
			const SITE = location.hostname === "localhost" ? "http://localhost:5173" : "";
			// The pixel font comes from the main site too (the build copies it to /fonts/), never a font
			// service: the same files, subsets and font-display: swap as the site's pages.
			for (const [subset, unicodeRange] of [
				["cyrillic-ext", "U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F"],
				["cyrillic", "U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116"],
				["greek", "U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF"],
				[
					"latin-ext",
					"U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF",
				],
				[
					"latin",
					"U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD",
				],
			]) {
				const src = `url(${SITE}/fonts/press-start-2p/press-start-2p-${subset}-400-normal.woff2) format("woff2")`;
				document.fonts.add(new FontFace("Press Start 2P", src, { unicodeRange, display: "swap" }));
			}
			// What's open stays open when the page redraws after a change.
			const openGroups = new Set();

			const el = (tag, props = {}, ...children) => {
				const node = Object.assign(document.createElement(tag), props);
				node.append(...children.filter((c) => c != null && c !== false));
				return node;
			};
			const field = (label, input, className = "") => el("label", { className: `field ${className}`.trim() }, el("span", { textContent: label }), input);
			const appName = (slug) => data.apps.find((a) => a.slug === slug)?.name ?? slug;
			const appSelect = (value) =>
				el("select", {}, ...data.apps.map((a) => el("option", { value: a.slug, textContent: a.name, selected: a.slug === value })));
			// A heading that folds away, remembered by key.
			function group(key, title, count, open, ...children) {
				const d = el("details", { className: "group", open: openGroups.has(key) || (open && !openGroups.has(`-${key}`)) },
					el("summary", {}, title, " ", el("span", { className: "count", textContent: `(${count})` })), ...children);
				d.addEventListener("toggle", () => {
					openGroups.delete(d.open ? `-${key}` : key);
					openGroups.add(d.open ? key : `-${key}`);
				});
				return d;
			}

			function toast(message) {
				const t = document.getElementById("toast");
				t.textContent = message;
				t.hidden = false;
				clearTimeout(toast.timer);
				toast.timer = setTimeout(() => (t.hidden = true), 2500);
			}

			async function api(path, body) {
				const res = await fetch(`/api/admin/${path}`, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
				const out = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(out.error || `Error ${res.status}`);
				return out;
			}
			// Runs an admin action, says how it went, and redraws.
			const run = (fn, done) => async () => {
				try {
					await fn();
					toast(typeof done === "function" ? done() : done);
					await load();
				} catch (err) {
					toast(err.message);
				}
			};

			async function load() {
				const y = scrollY;
				[data, flags] = await Promise.all([api("inbox"), api("flags").then((r) => r.flags).catch(() => flags)]);
				for (const p of data.players ?? []) p.shorts ??= p.team;
				renderInbox();
				renderFlags();
				renderIdeas();
				renderPlayers();
				renderScores();
				renderWords();
				renderTeams();
				scrollTo(0, y);
			}

			const modeName = (s) => ({ survival: "Sudden death", around: "Around the world", threes: "3-point contest" })[s.mode] ?? "Time attack";
			// Around the world scores are times in tenths of a second.
			const scoreText = (s) => (s.mode === "around" ? `${(s.score / 10).toFixed(1)}s` : String(s.score));
			// Odd-looking scores Orson hasn't looked at yet. They're on the board until he hides them.
			const suspicious = (s) => s.status === "shown" && !s.checked && JSON.parse(s.flags).length > 0;
			// Someone tapped "report" on its row on the leaderboard: the name may not be friendly.
			const reported = (s) => s.reports > 0;

			// ---------- Inbox: everything that needs a decision ----------

			function renderInbox() {
				const box = document.getElementById("inbox");
				const requests = data.players.filter((p) => p.status === "new");
				// One line per player on a device and game mode, like their row on the leaderboard.
				const byPlayer = new Map();
				const names = data.scores.filter(reported);
				for (const s of data.scores.filter((s) => suspicious(s) && !reported(s))) {
					const key = `${s.device} ${s.player} ${s.mode}`;
					byPlayer.set(key, [...(byPlayer.get(key) ?? []), s]);
				}
				const odd = [...byPlayer.values()];
				const asked = (data.teams ?? []).filter((t) => t.listing === "asked" && t.status === "ok");
				const total = data.submissions.length + requests.length + odd.length + names.length + asked.length + (data.digest ? 1 : 0);
				document.getElementById("inbox-count").textContent = total ? `(${total})` : "";
				box.replaceChildren();
				if (!total) return box.append(el("div", { className: "empty", innerHTML: "All caught up!<br>Nothing needs a look." }));
				box.append(
					el(
						"div",
						{ className: "summary" },
						data.submissions.length ? el("span", { textContent: `${data.submissions.length} new ideas` }) : null,
						requests.length ? el("span", { textContent: `${requests.length} player requests` }) : null,
						odd.length ? el("span", { textContent: `${odd.length} odd scores` }) : null,
						names.length ? el("span", { textContent: `${names.length} reported names` }) : null,
						asked.length ? el("span", { textContent: `${asked.length} teams to list` }) : null,
					),
				);
				if (data.digest) box.append(digestCard(data.digest));
				if (names.length) box.append(el("h2", { textContent: `Reported names (${names.length})` }), ...names.map(scoreRow));
				if (requests.length) box.append(el("h2", { textContent: `Player requests (${requests.length})` }), el("div", { className: "tiles" }, ...requests.map(playerTile)));
				if (asked.length) box.append(el("h2", { textContent: `Teams to list (${asked.length})` }), el("p", { className: "meta", textContent: "A kid asked to show their team to everyone. Check the name isn't a real school, club or person." }), el("div", { className: "teams" }, ...asked.map(teamCard)));
				if (data.submissions.length) {
					box.append(el("h2", { textContent: `New ideas (${data.submissions.length})` }));
					for (const [key, title, items] of ideaGroups()) box.append(group(`inbox ${key}`, title, items.length, true, ...items.map(submissionCard)));
				}
				if (odd.length) box.append(el("h2", { textContent: `Scores that look odd (${odd.length})` }), ...odd.map((list) => (list.length === 1 ? scoreRow(list[0]) : playerScoresRow(list))));
			}

			// The weekly digest: what was waiting on Monday (odd games, reported names). Each line says if it's
			// been dealt with since; the games themselves, with their buttons, are further down the inbox.
			function digestCard(d) {
				const waiting = new Map(data.scores.filter((s) => suspicious(s) || reported(s)).map((s) => [s.id, s]));
				const day = new Date(`${d.week}T00:00:00Z`).toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });
				const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
				const line = (item, what, chips) =>
					el(
						"li",
						{ className: waiting.has(item.id) ? "" : "done" },
						el("strong", { textContent: item.nickname }),
						el("span", { className: "what", textContent: `${what} · ${item.day}` }),
						...chips.map((c) => el("span", { className: "flag", textContent: c })),
						waiting.has(item.id) ? null : el("span", { className: "what", textContent: "Done" }),
					);
				return el(
					"div",
					{ className: "digest" },
					el(
						"div",
						{ className: "head" },
						el("span", { className: "title", textContent: `This week's check (${day})` }),
						el("button", { type: "button", className: "primary", textContent: "Got it", onclick: run(() => api(`digests/${d.id}`, { action: "seen" }), "Digest cleared") }),
					),
					el("div", {
						className: "what",
						textContent: `${plural(d.odd.length, "odd game")} (${d.newOdd} new this week) and ${plural(d.names.length, "reported name")} (${d.newNames} new this week) waiting.`,
					}),
					d.names.length ? el("ul", {}, ...d.names.map((n) => line(n, modeName(n), [`Name reported ${n.reports === 1 ? "once" : `${n.reports} times`}`]))) : null,
					d.odd.length ? el("ul", {}, ...d.odd.map((o) => line(o, `${modeName(o)} ${scoreText(o)}`, o.flags))) : null,
				);
			}

			// New ideas grouped by what to do with them: new for the board, each existing idea they'd join,
			// ones that need a decision, and suggested rejects. Matching titles sit together.
			function ideaGroups() {
				const groups = new Map();
				const add = (key, title, s) => {
					if (!groups.has(key)) groups.set(key, [key, title, []]);
					groups.get(key)[2].push(s);
				};
				for (const s of data.submissions) {
					const into = s.merge_into && data.ideas.find((i) => i.id === s.merge_into);
					if (into) add(`merge ${into.id}`, `Add to "${into.title}"`, s);
					else if (s.note?.startsWith("Reject")) add("reject", "Suggested: reject", s);
					else if (s.note?.startsWith("Add to the board")) add("new", "New for the board", s);
					else add("decide", "Needs a decision", s);
				}
				const order = (key) => (key === "new" ? 0 : key.startsWith("merge") ? 1 : key === "decide" ? 2 : 3);
				const list = [...groups.values()].sort((a, b) => order(a[0]) - order(b[0]) || a[1].localeCompare(b[1]));
				for (const g of list) g[2].sort((a, b) => (a.title ?? a.text).localeCompare(b.title ?? b.text) || a.id - b.id);
				return list;
			}

			function submissionCard(s) {
				// A tidied-up draft if there is one, otherwise their own words.
				const title = el("input", { type: "text", value: s.title ?? s.text.slice(0, 80), maxLength: 80 });
				const description = el("textarea", { value: s.description ?? s.text, maxLength: 500, rows: 2 });
				const app = appSelect(s.app);
				// Who the board credits for it: any name, or empty for none. Their nickname is one tap away.
				const credit = el("input", { type: "text", maxLength: 60, placeholder: "No credit" });
				const creditRow = el(
					"div",
					{ className: "credit-row" },
					credit,
					s.nickname ? el("button", { type: "button", textContent: `Use "${s.nickname}"`, onclick: () => (credit.value = s.nickname) }) : null,
				);
				const mergeInto = el(
					"select",
					{},
					el("option", { value: "", textContent: "Add to an idea…" }),
					...data.ideas.filter((i) => i.status !== "hidden").map((i) => el("option", { value: i.id, textContent: `${appName(i.app)}: ${i.title}`, selected: i.id === s.merge_into })),
				);
				const act = (action, extra, done) => run(() => api(`submissions/${s.id}`, { action, ...extra }), done);
				// Adding it to an existing idea: that idea's title and description to edit, and whether it
				// counts as an upvote and credits the sender. Shown once an idea is picked, in place of the
				// fields for a new idea.
				const mergeTitle = el("input", { type: "text", maxLength: 80 });
				const mergeDescription = el("textarea", { maxLength: 500, rows: 2 });
				const upvote = el("input", { type: "checkbox", checked: true });
				const creditSender = el("input", { type: "checkbox", checked: !!s.nickname });
				const mergeHeading = el("div", { className: "merge-head" });
				const mergePanel = el(
					"div",
					{ className: "merge-panel", hidden: true },
					mergeHeading,
					el("div", { className: "fields" }, field("Title", mergeTitle, "wide"), field("Description", mergeDescription, "wide")),
					el("label", { className: "check" }, upvote, "Count it as an upvote"),
					s.nickname ? el("label", { className: "check" }, creditSender, `Credit "${s.nickname}" too`) : null,
				);
				const newFields = el(
					"div",
					{ className: "fields" },
					field("Title", title),
					field("Game or app", app),
					field("Description", description, "wide"),
					el("div", { className: "field wide" }, el("span", { textContent: "Credit on the board" }), creditRow),
				);
				const showMerge = () => {
					const idea = data.ideas.find((i) => String(i.id) === mergeInto.value);
					mergePanel.hidden = !idea;
					newFields.hidden = !!idea;
					if (!idea) return;
					mergeHeading.textContent = `Adding to "${idea.title}" (${appName(idea.app)} · ▲${idea.votes}${idea.credit ? ` · credit: ${idea.credit}` : ""})`;
					mergeTitle.value = idea.title;
					mergeDescription.value = idea.description;
				};
				mergeInto.addEventListener("change", showMerge);
				showMerge();
				const headline = el("h3", { textContent: title.value });
				title.addEventListener("input", () => (headline.textContent = title.value));
				// The button the suggestion points to gets an outline.
				const suggested = s.merge_into
					? "merge"
					: /compliment|show Orson/i.test(s.note ?? "")
						? "keep"
						: s.note?.startsWith("Reject")
							? "reject" : s.note?.startsWith("Add to the board") ? "add" : null;
				const mark = (which, className = "") => (suggested === which ? `${className} suggested`.trim() : className);
				return el(
					"div",
					{ className: "sub" },
					el(
						"div",
						{},
						el("div", { className: "meta", textContent: `${appName(s.app)} · ${s.nickname ? `from ${s.nickname}` : "no name"} · ${s.created_at.slice(0, 10)}` }),
						headline,
						el("p", { className: "quote", textContent: `They wrote: "${s.text}"` }),
						s.note ? el("p", { className: "note", textContent: s.note }) : null,
						newFields,
						mergePanel,
					),
					el(
						"div",
						{ className: "actions" },
						el("button", {
							type: "button",
							className: mark("add", "primary"),
							textContent: "Add to board",
							onclick: () => act("approve", { title: title.value, description: description.value, app: app.value, credit: credit.value.trim() }, "On the board!")(),
						}),
						mergeInto,
						el("button", {
							type: "button",
							className: mark("merge"),
							textContent: "Add to that idea",
							onclick: () =>
								mergeInto.value
									? act(
											"merge",
											{ ideaId: mergeInto.value, title: mergeTitle.value, description: mergeDescription.value, upvote: upvote.checked, credit: creditSender.checked },
											"Added to idea",
										)()
									: toast("Pick an idea first"),
						}),
						el("button", { type: "button", className: mark("keep", "keep"), textContent: "Keep as kind words", onclick: act("keep", {}, "Kept in Kind words") }),
						el("button", { type: "button", className: mark("reject", "danger"), textContent: "Reject", onclick: act("reject", {}, "Rejected") }),
					),
				);
			}

			// ---------- Ideas on the board ----------

			function renderIdeas() {
				const box = document.getElementById("ideas");
				box.replaceChildren();
				if (!data.ideas.length) return box.append(el("div", { className: "empty", textContent: "No ideas on the board yet." }));
				for (const app of data.apps) {
					const ideas = data.ideas.filter((i) => i.app === app.slug);
					if (!ideas.length) continue;
					box.append(el("h2", { textContent: `${app.name} (${ideas.length})` }));
					for (const [status, title, open] of STATUS_GROUPS) {
						const list = ideas.filter((i) => i.status === status).sort((a, b) => b.votes - a.votes || a.title.localeCompare(b.title));
						if (list.length) box.append(group(`ideas ${app.slug} ${status}`, title, list.length, open, ...list.map(ideaRow)));
					}
				}
			}

			function ideaRow(idea) {
				const title = el("input", { type: "text", value: idea.title, maxLength: 80 });
				const description = el("textarea", { value: idea.description, maxLength: 500, rows: 2 });
				const credit = el("input", { type: "text", value: idea.credit ?? "", maxLength: 60, placeholder: "No credit" });
				const status = el("select", {}, ...STATUSES.map((s) => el("option", { value: s, textContent: s, selected: s === idea.status })));
				// Which game or app it's under: change it and save to move the idea there.
				const app = appSelect(idea.app);
				app.title = "Game or app";
				return el(
					"div",
					{ className: "idea" },
					el("div", { className: "votes", title: "Votes", textContent: `▲${idea.votes}` }),
					title,
					app,
					status,
					el("div", { className: "credit" }, credit),
					el("button", {
						type: "button",
						className: "primary save",
						textContent: "Save",
						onclick: run(() => api(`ideas/${idea.id}`, { title: title.value, description: description.value, credit: credit.value, status: status.value, app: app.value }), () => (app.value === idea.app ? "Saved" : `Moved to ${appName(app.value)}`)),
					}),

				);
			}

			// The feature flag that delivers this idea, if any: while it's off the board says "Coming soon",
			// and switching it on marks the idea done (Flags section).
			function flagLink(idea) {
				const current = flags.find((f) => f.idea_id === idea.id);
				const ideaTitle = (id) => data.ideas.find((i) => i.id === id)?.title ?? `idea ${id}`;
				const pick = el(
					"select",
					{ title: "Feature flag" },
					el("option", { value: "", textContent: "No flag", selected: !current }),
					...flags.map((f) =>
						el("option", { value: f.key, selected: f === current, textContent: f.idea_id && f.idea_id !== idea.id ? `${f.name} (now on: ${ideaTitle(f.idea_id)})` : `${f.name} (${f.on ? "on" : "off"})` }),
					),
				);
				pick.addEventListener(
					"change",
					run(async () => {
						if (current) await api("flags", { key: current.key, ideaId: null });
						if (pick.value) await api("flags", { key: pick.value, ideaId: idea.id });
					}, () => (pick.value ? "Linked to its flag" : "Unlinked")),
				);
				return el("div", { className: "flag-link" }, el("span", { className: "meta", textContent: "Flag:" }), pick, current && !current.on ? el("span", { className: "meta", textContent: "Shows as Coming soon" }) : null);
			}

			// ---------- Players ----------

			function renderPlayers() {
				const box = document.getElementById("players");
				box.replaceChildren();
				if (!data.players.length) return box.append(el("div", { className: "empty", innerHTML: "No players yet.<br>They're made at /players/" }));
				const by = (status) => data.players.filter((p) => p.status === status).sort((a, b) => a.name.localeCompare(b.name));
				const sections = [
					["new", "Requests waiting", true],
					["approved", "In the game", true],
					["hidden", "Hidden", false],
				];
				for (const [status, title, open] of sections) {
					const list = by(status);
					if (list.length) box.append(group(`players ${status}`, title, list.length, open, el("div", { className: "tiles" }, ...list.map(playerTile))));
				}
			}

			// A player front and back in their own colours, number and team name, drawn by the same code
			// as the builder and the game (players/recolor.js, which the site serves at a fixed address).
			// Until it's drawn the plain body shows; if it can't be drawn, the picture says so.
			let recolorKit;
			const kit = () => (recolorKit ??= import(`${SITE}/players/recolor.js`));
			let basesList;
			const bases = () => (basesList ??= kit().then(({ loadBases }) => loadBases(`${SITE}/`)));
			// The colours exactly as the game reads a builder player (play/players.js).
			const lookOf = (p) => ({ skin: p.skin, hair: p.hair, jersey: p.jersey, team: p.team, shorts: p.shorts, shoes: p.shoes, number: p.number ?? "", teamName: p.team_name ?? "KINGS" });
			function paintPlayer(img, p) {
				const ticket = (img.dataset.ticket = String(Number(img.dataset.ticket ?? 0) + 1));
				kit()
					.then(async ({ loadBase, recolor }) => {
						const base = (await bases()).find((b) => b.id === p.base);
						if (!base) throw new Error(`No body called ${p.base}`);
						const loaded = await loadBase(base, `${SITE}/`);
						const look = lookOf(p);
						// Standing facing us (team name and number on the front), and dribbling away (number on the back).
						const frames = [loaded.meta.frames.idle[0], loaded.meta.frames.dribble?.[0]].filter(Boolean);
						const sheets = frames.map((f) => recolor(loaded, look, f.slice(0, 4)));
						const gap = 6;
						const c = document.createElement("canvas");
						c.width = sheets.reduce((w, s) => w + s.width, 0) + gap * (sheets.length - 1);
						c.height = Math.max(...sheets.map((s) => s.height));
						const g = c.getContext("2d");
						let x = 0;
						for (const s of sheets) {
							g.drawImage(s, x, c.height - s.height);
							x += s.width + gap;
						}
						// Only the latest change shows, if the editor redraws quickly.
						if (img.dataset.ticket !== ticket) return;
						img.src = c.toDataURL();
						img.classList.remove("failed");
						img.title = "";
					})
					.catch((err) => {
						console.error(err);
						img.classList.add("failed");
						img.title = "Couldn't draw their colours";
					});
			}

			// A request that looks like someone already in the game: the same name, or the same look.
			function lookalike(p) {
				const others = data.players.filter((o) => o.id !== p.id && o.status === "approved");
				const sameName = others.find((o) => o.name.toLowerCase() === p.name.toLowerCase());
				if (sameName) return `Same name as ${sameName.name}, who's already in the game.`;
				const sameLook = others.find((o) => o.base === p.base && PARTS.every((part) => o[part] === p[part]));
				if (sameLook) return `Looks the same as ${sameLook.name}, who's already in the game.`;
				return null;
			}

			function playerTile(p) {
				const face = el("img", { src: `${SITE}/assets/characters/bases/${p.base}/thumb.webp`, alt: "" });
				paintPlayer(face, p);
				const save = (body, done) => run(() => api(`players/${p.id}`, { name: p.name, ...body }), done);
				const warn = p.status === "new" ? lookalike(p) : null;
				const editor = playerEditor(p, face);
				editor.hidden = true;
				return el(
					"div",
					{ className: "player" },
					face,
					el(
						"div",
						{},
						el("div", { className: "name", textContent: p.name }),
						el("div", { className: "meta", textContent: `${p.base} · ${p.team_name} ${p.number ? `#${p.number}` : "(no number)"} · ${p.pronoun ?? "he/she by body"} · ${p.created_at.slice(0, 10)}` }),
						el("div", { className: "swatches" }, ...PARTS.map((part) => el("span", { title: part, style: `background:${p[part]}` }))),
					),
					warn ? el("div", { className: "warn", textContent: warn }) : null,
					el(
						"div",
						{ className: "buttons" },
						p.status !== "approved" ? el("button", { type: "button", className: "primary", textContent: "Put in game", onclick: save({ action: "approve" }, "In the game!") }) : null,
						p.status !== "hidden" ? el("button", { type: "button", textContent: "Hide", onclick: save({ action: "hide" }, "Hidden") }) : null,
						el("button", { type: "button", textContent: "Edit", onclick: () => (editor.hidden = !editor.hidden) }),
					),
					editor,
				);
			}

			// Everything about a player: name, body, colours, number, team and where they are.
			function playerEditor(p, face) {
				const name = el("input", { type: "text", value: p.name, maxLength: 12 });
				const base = el("select", {}, el("option", { value: p.base, textContent: p.base, selected: true }));
				bases().then((list) => base.replaceChildren(...list.map((b) => el("option", { value: b.id, textContent: b.name, selected: b.id === p.base })))).catch(() => {});
				const colours = Object.fromEntries(PARTS.map((part) => [part, el("input", { type: "color", value: p[part], title: part })]));
				const number = el("input", { type: "text", value: p.number ?? "", maxLength: 2, placeholder: "None", inputMode: "numeric" });
				const team = el("input", { type: "text", value: p.team_name, maxLength: 12 });
				// For the announcer's lines ("She's heating up!"). Not set: the body's (ponytail and buns are she).
				const pronoun = el(
					"select",
					{},
					...[["", "By body"], ["he", "He"], ["she", "She"]].map(([v, t]) => el("option", { value: v, textContent: t, selected: v === (p.pronoun ?? "") })),
				);
				const status = el(
					"select",
					{},
					...[["new", "Waiting"], ["approved", "In the game"], ["hidden", "Hidden"]].map(([v, t]) => el("option", { value: v, textContent: t, selected: v === p.status })),
				);
				// The face updates as things change, before saving.
				const current = () => ({ ...p, base: base.value, ...Object.fromEntries(PARTS.map((part) => [part, colours[part].value])), number: number.value, team_name: team.value.toUpperCase() });
				for (const input of [base, ...Object.values(colours), number, team]) input.addEventListener("input", () => paintPlayer(face, current()));
				const look = () => {
					const c = current();
					const q = new URLSearchParams({ base: c.base, name: name.value });
					for (const part of PARTS) q.set(part, c[part].slice(1));
					if (c.number) q.set("number", c.number);
					if (pronoun.value) q.set("pronoun", pronoun.value);
					q.set("teamName", c.team_name);
					return `${SITE}/players/?${q}`;
				};
				const action = { new: "unapprove", approved: "approve", hidden: "hide" };
				return el(
					"div",
					{ className: "editor" },
					field("Name", name),
					field("Body", base),
					el("div", { className: "colours" }, ...PARTS.map((part) => field(part, colours[part]))),
					field("Number", number),
					field("Team name", team),
					field("He or she", pronoun),
					field("Where", status),
					el(
						"div",
						{ className: "buttons wide", style: "display:flex;gap:5px;flex-wrap:wrap;align-items:center" },
						el("button", {
							type: "button",
							className: "primary",
							textContent: "Save",
							onclick: run(
								() =>
									api(`players/${p.id}`, {
										action: action[status.value],
										name: name.value,
										base: base.value,
										colours: Object.fromEntries(PARTS.map((part) => [part, colours[part].value])),
										number: number.value.trim(),
										teamName: team.value,
										pronoun: pronoun.value,
									}),
								"Saved",
							),
						}),
						el("a", { href: "#", textContent: "See them move ▸", onclick: (e) => (e.preventDefault(), open(look(), "_blank")) }),
						el("span", { style: "flex:1" }),
						el("button", {
							type: "button",
							className: "danger",
							textContent: "Delete",
							onclick: () => confirm(`Delete ${p.name} for good?`) && run(() => api(`players/${p.id}`, { action: "delete" }), "Deleted")(),
						}),
					),
				);
			}

			// ---------- Teams ----------

			// Community teams kids made (the teams flag). Private ones work straight away after the word filter;
			// listing one for everyone needs Luke's OK on its name. Hiding one takes it off every board, and
			// its members go back to an official team.
			const LISTING = { private: "Private (code only)", asked: "Wants to be listed", listed: "Listed for everyone", refused: "Name not OKed: private" };
			const kitSwatch = (k) => el("span", { className: "kit" }, ...["jersey", "shorts", "trim"].map((p) => el("span", { style: `background:${k?.[p] ?? "#000"}` })));
			function teamCard(t) {
				const act = (action, extra, done) => run(() => api(`teams/${t.id}`, { action, ...extra }), done);
				const name = el("input", { type: "text", value: t.name, maxLength: 10 });
				const code = el("b", { className: "team-new-code" });
				return el(
					"div",
					{ className: "team-card" },

			// Several odd scores from one player: checked together, each one still there to open.
			function playerScoresRow(list) {
				const best = list.reduce((a, b) => ((list[0].mode === "around" ? b.score < a.score : b.score > a.score) ? b : a));

				for (const s of list)
					for (const f of JSON.parse(s.flags)) {
						const kind = f.replace(/\d+/g, "N"); // "Nx this device's best" from several games is one kind
						flags.set(kind, [...(flags.get(kind) ?? []), f]);
					}

					for (const s of list) await api(`scores/${s.id}`, { action });
				}, done);
				return el(
					"div",
					{ className: "score" },
					el("span", { className: "points", textContent: scoreText(best) }),
					el("b", { textContent: best.nickname }),
					el("span", { className: "mode meta", textContent: modeName(best) }),
					el("span", { className: "made meta", textContent: `${list.length} games` }),
					el("span", { className: "when meta", textContent: list[0].created_at.slice(0, 10) }),

			function scoreRow(s) {
				const flags = JSON.parse(s.flags);
				const log = JSON.parse(s.log);
				const gaps = log.slice(1).map((shot, i) => shot[0] - log[i][0]);
				const fastest = gaps.length ? Math.min(...gaps).toFixed(1) : "-";
				const odd = suspicious(s);
				const act = (action, done) => run(() => api(`scores/${s.id}`, { action }), done);
				// Who they played as: a built-in player's name, or "Own player" for one made on their device.
				const who = /^me\d+$/.test(s.player) ? "own player" : s.player;

				const nickname = el("input", { type: "text", value: s.nickname, maxLength: 12, ariaLabel: "New nickname" });
				const rename = run(
					() => api(`scores/${s.id}`, { action: "rename", nickname: nickname.value }),
					() => `Renamed to ${nickname.value.trim()}`,

				nickname.addEventListener("keydown", (e) => e.key === "Enter" && rename());

					el(
						"div",
						{ className: "stats" },
						el("span", { textContent: `Threes made: ${s.threes}` }),
						el("span", { textContent: `Fastest gap: ${fastest}s` }),
						el("span", { textContent: `Sent after: ${Math.round(s.real_seconds)}s` }),
						el("span", { textContent: `Played with: ${s.input ?? "?"}` }),
						s.hidden_tab ? el("span", { textContent: "Tab hidden mid-game" }) : null,
					),
					el("div", { className: "rename" }, nickname, el("button", { type: "button", textContent: "Rename", onclick: rename })),
					el(
						"div",
						{ className: "shots", title: "Each shot in order: green went in, yellow edge was a three" },
						...log.map((shot) => el("span", { className: `${shot[2] ? "in" : ""} ${shot[1] ? "three" : ""}`, title: `${shot[0]}s, timing ${shot[3]}` })),
					),
				);
				return el(
					"div",
					{ className: `score${s.status === "hidden" ? " hidden-score" : ""}` },
					el("span", { className: "points", textContent: scoreText(s) }),
					el("b", { className: "who", textContent: s.nickname }),
					el("span", { className: "mode meta", textContent: `${modeName(s)} · ${who}` }),

					el("span", { className: "when meta", textContent: s.created_at.slice(5, 16).replace("T", " ") }),

					el(

						...flags.map((f) => el("span", { className: odd ? "flag" : "flag seen", textContent: f })),
					),
					el(
						"div",
						{ className: "buttons" },
						el("button", { type: "button", textContent: "More", onclick: () => (more.hidden = !more.hidden) }),
						odd ? el("button", { type: "button", className: "primary", textContent: "Fine", onclick: act("show", "Kept on the board") }) : null,
						reported(s) ? el("button", { type: "button", className: "primary", textContent: "Looks fine", onclick: act("name-ok", "Name kept") }) : null,
						s.status === "hidden"
							? el("button", { type: "button", className: "primary", textContent: "Show", onclick: act("show", "On the board") })
							: reported(s)

			// ---------- Stats ----------
			// Totals only, from what's already saved (worker/src/stats.ts). A "save" is one saved progress:
			// a device, or devices joined with a code, so it's the nearest thing to a player.
			const MODE_ORDER = ["timed", "survival", "around", "threes", "horse"];
			const MODE_NAMES = { timed: "Time attack", survival: "Sudden death", around: "Around the World", threes: "3-point contest", horse: "HORSE" };
			const SERIES = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181"]; // fixed order, checked for colour blindness on the panel
			const PAGE_NAMES = { "/": "Home", "/games/shootaround/": "Game", "/players/": "Player builder", "/ideas/": "Ideas board" };
			const total = (a) => a.reduce((x, y) => x + y, 0);
			const pct = (n, d) => (d ? `${Math.round((100 * n) / d)}%` : "-");
			const shortDay = (d) => new Date(`${d}T00:00:00Z`).toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });
			const svg = (tag, attrs = {}) => {
				const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
				for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
				return n;
			};
			const swatch = (color) => {
				const i = el("i");
				i.style.background = color;
				return i;
			};

			// Bars by day (stacked when there's more than one series). Hover a day for its numbers.
			function dayChart(days, series) {
				const W = 600, H = 150, FOOT = 18, slot = W / days.length;
				const sums = days.map((_, i) => total(series.map((s) => s.values[i])));
				const max = Math.max(1, ...sums);
				const chart = svg("svg", { viewBox: `0 0 ${W} ${H + FOOT}`, class: "chart", role: "img", "aria-label": series.map((s) => s.name).join(", ") });
				const top = svg("text", { x: 0, y: 11, class: "tick" });
				top.textContent = String(max);
				chart.append(top, svg("line", { x1: 0, x2: W, y1: H, y2: H, class: "axis" }));
				days.forEach((d, i) => {
					const g = svg("g", { class: "day" });
					let y = H;
					for (const s of series) {
						const v = s.values[i];
						if (!v) continue;
						const h = Math.max(2, (v / max) * (H - 18));
						y -= h;
						g.append(svg("rect", { x: i * slot + 1, y, width: Math.max(2, slot - 2), height: Math.max(1, h - 2), fill: s.color, rx: 1.5 }));
					}
					const hit = svg("rect", { x: i * slot, y: 0, width: slot, height: H, fill: "transparent" });
					const tip = svg("title");
					tip.textContent = [`${shortDay(d)}: ${sums[i]}`, ...(series.length > 1 ? series.filter((s) => s.values[i]).map((s) => `${s.name}: ${s.values[i]}`) : [])].join("\n");
					hit.append(tip);
					g.append(hit);
					chart.append(g);
				});
				for (const [i, anchor] of [[0, "start"], [days.length - 1, "end"]]) {
					const t = svg("text", { x: anchor === "start" ? 0 : W, y: H + FOOT - 3, "text-anchor": anchor, class: "tick" });
					t.textContent = shortDay(days[i]);
					chart.append(t);
				}
				const legend = series.length > 1 ? el("div", { className: "legend" }, ...series.map((s) => el("span", {}, swatch(s.color), `${s.name}: ${total(s.values)}`))) : null;
				return el("div", {}, chart, legend);
			}

			const panel = (title, ...children) => el("div", { className: "panel" }, el("h3", { textContent: title }), ...children);
			const note = (text) => el("p", { className: "note", textContent: text });
			const tile = (label, value, small) => el("div", { className: "tile" }, el("span", { textContent: label }), el("b", { textContent: String(value) }), small ? el("small", { textContent: small }) : null);
			// Horizontal bars: label, bar, number (and share of `of`, when given).
			function bars(rows, of) {
				const max = Math.max(1, of ?? 0, ...rows.map((r) => r.n));
				return el(
					"div",
					{ className: "bars" },
					...rows.map((r) => {
						const fill = el("div", { className: "fill" });
						fill.style.width = `${(100 * r.n) / max}%`;
						return el("div", { className: "bar" }, el("span", { textContent: r.name }), el("div", { className: "track" }, fill), el("span", { className: "val", textContent: of != null ? `${r.n} (${pct(r.n, of)})` : String(r.n) }));
					}),
				);
			}
			const characterName = (id) => {
				if (id === "own") return "Their own player";
				const p = /^p(\d+)$/.exec(id) && data.players.find((q) => `p${q.id}` === id);
				return p ? p.name : id[0].toUpperCase() + id.slice(1);
			};

			let statsLoading = null;
			async function loadStats() {
				const box = document.getElementById("stats");
				if (statsLoading) return;
				if (!box.childElementCount) box.append(el("div", { className: "empty", textContent: "Counting..." }));
				statsLoading = api("stats")
					.then(renderStats)
					.catch((err) => box.replaceChildren(el("div", { className: "empty", textContent: err.message })))
					.finally(() => setTimeout(() => (statsLoading = null), 60000)); // the server keeps it a few minutes anyway
			}

			function renderStats(s) {
				const box = document.getElementById("stats");
				const modes = MODE_ORDER.filter((m) => s.games[m]).map((m, i) => ({ name: MODE_NAMES[m], color: SERIES[i], values: s.games[m] }));
				const games = total(modes.map((m) => total(m.values)));
				const a = s.adoption;
				const gameViews = s.pages["/games/shootaround/"] ? total(s.pages["/games/shootaround/"].views) : 0;
				const pageSeries = Object.keys(PAGE_NAMES)
					.filter((p) => s.pages[p])
					.map((p, i) => ({ name: PAGE_NAMES[p], color: SERIES[i], values: s.pages[p].views }));
				box.replaceChildren(
					el("h2", { textContent: "Last 30 days" }),
					el(
						"div",
						{ className: "stat-tiles" },
						tile("Playing today", s.active.today, "saves with a finished game"),
						tile("This week", s.active.week, "saves"),
						tile("Last 30 days", s.active.month, "saves"),
						tile("Finished games", games),
						tile("New saves", total(s.newSaves)),
						tile("Came back", pct(s.cameBack, s.active.month), `${s.cameBack} played on 2 or more days`),
						tile("Back a week later", pct(s.weekLater.back, s.weekLater.made), `of ${s.weekLater.made} saves made 1 to 5 weeks ago`),
					),
					el("h2", { textContent: "Playing" }),
					panel("Finished games a day, by mode", dayChart(s.days, modes), note("Games that finished online. Offline games and ?debug games aren't counted.")),
					panel("Saves playing each day", dayChart(s.days, [{ name: "Saves", color: SERIES[0], values: s.activeSaves }])),
					el("h2", { textContent: "Visits" }),
					s.pageViewsReady && pageSeries.length
						? panel(
								"Pages viewed a day",
								dayChart(s.days, pageSeries),
								note(
									`Cloudflare's counts (sampled, so roughly). The game page was opened ${gameViews} times for ${games} finished games.` +
										(s.pageViewsError ? ` Couldn't refresh just now: ${s.pageViewsError}` : ""),
								),
							)
						: panel(
								"Pages viewed a day",
								note(
									!s.pageViewsReady
										? "Waiting for the Cloudflare analytics token (CF_ANALYTICS_TOKEN)."
										: s.pageViewsError
											? `Couldn't get page views from Cloudflare: ${s.pageViewsError}`
											: "No page views from Cloudflare yet.",
								),
							),
					el("h2", { textContent: "Features" }),
					el(
						"div",
						{ className: "grid2" },
						panel(
							`Of the ${a.saves} saves that played`,
							bars(
								[
									{ name: "On a leaderboard", n: a.leaderboard },
									{ name: "Daily challenge", n: a.daily },
									{ name: "Bought a ball", n: a.shop },
									{ name: "Using a new ball", n: a.ball },
									{ name: "Made a player", n: a.builder },
									{ name: "Joined with a code", n: a.paired },
									{ name: "Played HORSE", n: a.horse },
								],
								a.saves,
							),
						),
						panel("Balls in use", bars(s.balls.map((b) => ({ name: b.name[0].toUpperCase() + b.name.slice(1), n: b.n })))),
						panel("Played as (leaderboard sends)", bars(s.characters.map((c) => ({ name: characterName(c.name), n: c.n })))),
						panel("How they play (leaderboard sends)", bars(s.inputs.map((c) => ({ name: c.name[0].toUpperCase() + c.name.slice(1), n: c.n })))),
						panel("Game versions this week", bars(s.versions.map((v) => ({ name: v.name.slice(0, 7), n: v.n })))),
						panel(
							"Around the site",
							bars([
								{ name: "Leaderboard sends", n: total(s.leaderboardSends) },
								{ name: "Players made", n: total(s.builderPlayers) },
								{ name: "Ideas sent", n: total(s.ideasSent) },
								{ name: "Votes", n: total(s.votes) },
							]),
						),
					),
				);
			}

			// Feature flags (worker/src/flags.ts): things that are built but not out yet. Each is off (hidden
			// from everyone) until switched on here. The game picks a change up within a minute or two.
			async function loadFlags() {
				const box = document.getElementById("flags");
				if (!box.childElementCount) box.append(el("div", { className: "empty", textContent: "Loading..." }));
				try {
					flags = (await api("flags")).flags;
					renderFlags();
				} catch (err) {
					box.replaceChildren(el("div", { className: "empty", textContent: err.message }));
				}
			}

			// A flag's idea (optional): the one it delivers. Picking one here or on the idea is the same link.
			function ideaLink(f) {
				const pick = el(
					"select",
					{ title: "The idea it delivers" },
					el("option", { value: "", textContent: "No idea", selected: !f.idea_id }),
					...data.ideas.filter((i) => i.status !== "hidden" || i.id === f.idea_id).map((i) => el("option", { value: String(i.id), selected: i.id === f.idea_id, textContent: `${appName(i.app)}: ${i.title}` })),
				);
				pick.addEventListener(
					"change",
					run(() => api("flags", { key: f.key, ideaId: pick.value ? Number(pick.value) : null }), () => (pick.value ? "Linked to the idea" : "Unlinked")),
				);
				return el("label", { className: "idea-link" }, el("span", { className: "meta", textContent: "Idea:" }), pick);
			}

			function renderFlags() {
				const box = document.getElementById("flags");
				if (!flags.length) return;
				const card = (f) => {
					const button = el("button", { type: "button", className: f.on ? "" : "primary", textContent: f.on ? "Switch off" : "Switch on" });
					button.addEventListener("click", async () => {
						button.disabled = true;
						try {
							await api("flags", { key: f.key, on: !f.on });
							// This browser's kept flags (flags.js, same site) are out of date: fetched afresh on its next page.
							try {
								localStorage.removeItem("orson-flags");
							} catch {}
							toast(`${f.name} is ${f.on ? "off" : "on"}.${!f.on && f.idea_id ? " Its idea is done." : ""}`);
							await load();
						} catch (err) {
							toast(err.message);
							button.disabled = false;
						}
					});
					return el(
						"div",
						{ className: "feature" },
						el("h3", {}, f.name, el("span", { className: `state ${f.on ? "on" : "off"}`, textContent: f.on ? "ON" : "OFF" })),
						el("p", { textContent: `${f.on ? "Shows" : "Hides"}: ${f.hides}` }),
						el("p", { className: "meta", textContent: `${f.updated_at ? `Changed ${f.updated_at.slice(0, 10)}` : "Never switched on"}. Try it: ?flags=${f.key}` }),
						ideaLink(f),
						button,
					);
				};
				box.replaceChildren(
					el("h2", { textContent: "Flags" }),
					el("p", {
						className: "meta",
						textContent: "Things that are built but not out yet. Off hides them from everyone. To try one without switching it on, add ?flags= and its name (or ?flags=all, or ?debug) to the game's address. A flag linked to an idea shows the idea as Coming soon, and switching the flag on marks the idea done.",
					}),
					el("div", { className: "features" }, ...flags.map(card)),
				);
			}

			// Each section has its own address (/admin is the inbox, then /admin/ideas and so on), so a
			// link or a reload opens it and Back goes to the one before. The Worker serves this page for all.
			const TABS = ["inbox", "ideas", "players", "scores", "teams", "words", "stats", "flags"];
			const sectionOf = (path) => TABS.find((t) => t !== "inbox" && new RegExp(`^/admin/${t}/?$`).test(path)) ?? "inbox";
			function show(section) {
				for (const t of TABS) {
					const tab = document.getElementById(`tab-${t}`);
					if (t === section) tab.setAttribute("aria-current", "page");
					else tab.removeAttribute("aria-current");
					document.getElementById(t).hidden = t !== section;
				}
				if (section === "stats") loadStats();
				if (section === "flags") loadFlags();
				const name = section === "words" ? "Kind words" : `${section[0].toUpperCase()}${section.slice(1)}`;
				document.title = `${section === "inbox" ? "Admin" : `${name} | Admin`} | Orson Brooker`;
			}
			for (const section of TABS) {
				document.getElementById(`tab-${section}`).addEventListener("click", (e) => {
					// A new tab or window (cmd-click, middle click) opens the address as a normal link.
					if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
					e.preventDefault();
					if (sectionOf(location.pathname) !== section) history.pushState(null, "", e.currentTarget.href);
					show(section);
					scrollTo(0, 0);
				});
			}
			addEventListener("popstate", () => show(sectionOf(location.pathname)));
			show(sectionOf(location.pathname));

			load().catch((err) => {
				document.getElementById("inbox").replaceChildren(el("div", { className: "empty", textContent: err.message }));
			});
		</script>
	</body>
</html>
