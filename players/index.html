  </head>
  <body>
    <nav class="site-nav" data-site-nav></nav>
    <header>
      <a class="back-link" data-back-link href="/games/shootaround/"></a>
      <h1>Make your player</h1>
      <p>Make your player and play as them straight away. Send them to me to put them in the game for everyone!</p>
    </header>

    <main class="builder" id="builder">
      <div class="builder-preview">
        <canvas id="preview" width="360" height="460" aria-label="Your player"></canvas>
        <p class="builder-name" id="preview-name"></p>
      </div>

      <form class="builder-form" id="form">
        <fieldset>
          <legend>Body</legend>
          <div class="choices" id="bases"></div>
        </fieldset>
        <fieldset>
          <legend>Skin</legend>
          <div class="choices swatches" data-part="skin"></div>
        </fieldset>
        <fieldset>
          <legend>Hair</legend>
          <div class="choices swatches" data-part="hair"></div>
        </fieldset>
        <fieldset>
          <legend>Jersey</legend>
          <div class="choices swatches" data-part="jersey"></div>
        </fieldset>
        <fieldset>
          <legend>Team colour</legend>
          <div class="choices swatches" data-part="team"></div>
        </fieldset>
        <fieldset>
          <legend>Shoes</legend>
          <div class="choices swatches" data-part="shoes"></div>
        </fieldset>
        <fieldset>
          <legend><label for="team-name">Team</label></legend>
          <input id="team-name" type="text" maxlength="10" autocomplete="off" value="KINGS" />
        </fieldset>
        <fieldset>
          <legend><label for="number">Number</label></legend>
          <input id="number" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="0 to 99" />
        </fieldset>
        <fieldset>
          <legend><label for="name">Nickname</label></legend>
          <input id="name" type="text" maxlength="12" autocomplete="off" required placeholder="Up to 12 letters" />
          <p class="fb-hint">Just a nickname, please. No real names or schools.</p>
        </fieldset>
        <button type="button" class="fb-button fb-primary" id="play">Play as them now!</button>
        <p class="fb-hint">Saved on this device, so only you can see them.</p>
        <div class="fb-check" id="check"></div>
        <p class="fb-message" id="message" role="status"></p>
        <button type="submit" class="fb-button" id="send">Send to Orson for everyone</button>
      </form>
    </main>

    <script type="module" src="../players/builder.js?v=7457d450"></script>
    <script type="module" src="../ui/nav.js?v=718654c5"></script>
  </body>
</html>
